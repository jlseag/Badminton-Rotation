/* ---- long-press drag: reorder players and move them between tiers ---- */
let dragger=null;
/* The same gesture now drives two lists: tonight's lineup on the Players tab
   and the roster history in its sheet. They differ only in what a tap opens
   and where the new order is written, so both travel with the drag. */
function wirePlayerDrag(){ wireDrag('#plist', commitOrder, id => playerSheet(id)); }
function wireDrag(sel, commit, tap){
  const list=$(sel); if(!list)return;
  list.querySelectorAll('.pitem').forEach(el=>{
    el.addEventListener('pointerdown',e=>pdDown(e,commit,tap));
    el.addEventListener('contextmenu',e=>e.preventDefault());
    const grip=el.querySelector('.grip');
    if(grip)grip.addEventListener('pointerdown',e=>{
      // the handle is touch-action:none, so the browser never steals this gesture
      if(e.button!==undefined&&e.button>0)return;
      e.preventDefault(); e.stopPropagation();
      try{grip.setPointerCapture(e.pointerId)}catch(_){}
      startDrag(el,e.clientX,e.clientY,e.pointerId,commit);
    });
  });
}
function pdDown(e,commit,tap){
  if(e.button!==undefined&&e.button>0)return;
  // The grip starts a drag; any BUTTON in the row is its own control and the
  // row must keep its hands off it. Without .awaybtn here a tap on Away either
  // got eaten by the 300ms long-press (the row jumped into drag mode, so the
  // click never fired) or fell through to playerSheet() -- which is why the
  // host reported that Away does nothing.
  if(e.target.closest('.grip'))return;
  if(e.target.closest('button'))return;
  const el=e.currentTarget, sx=e.clientX, sy=e.clientY;
  let moved=false;
  const timer=setTimeout(()=>{if(!moved)startDrag(el,sx,sy,e.pointerId,commit)},300);
  const move=ev=>{if(Math.abs(ev.clientX-sx)>9||Math.abs(ev.clientY-sy)>9){moved=true;done()}};
  const up=()=>{clearTimeout(timer);done();if(!moved&&!dragger)(tap||playerSheet)(el.dataset.id)};
  function done(){clearTimeout(timer);
    el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);
    el.removeEventListener('pointercancel',done);}
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',done);
}
function startDrag(el,sx,sy,pid,commit){
  const r=el.getBoundingClientRect();
  const ph=document.createElement('div');
  ph.className='pitem placeholder'; ph.style.height=r.height+'px';
  el.parentNode.insertBefore(ph,el);
  el.classList.add('lifted');
  el.style.width=r.width+'px'; el.style.height=r.height+'px';
  el.style.left=r.left+'px'; el.style.top=r.top+'px';
  document.body.appendChild(el);
  dragger={el,ph,dx:sx-r.left,dy:sy-r.top,x:sx,y:sy,dir:0,raf:null,commit:commit||commitOrder};
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(_){}
  document.addEventListener('pointermove',dragMove,{passive:false});
  document.addEventListener('pointerup',dragEnd);
  document.addEventListener('pointercancel',dragEnd);
  document.addEventListener('touchmove',blockScroll,{passive:false});
}
function blockScroll(e){if(dragger)e.preventDefault()}
function dragMove(e){
  if(!dragger)return;
  e.preventDefault();
  dragger.x=e.clientX; dragger.y=e.clientY;
  updateDrop();
  autoScroll();
}
function updateDrop(){
  if(!dragger)return;
  const {el,ph,dx,dy,x,y}=dragger;
  el.style.left=(x-dx)+'px';
  el.style.top=(y-dy)+'px';
  el.style.visibility='hidden';
  const under=document.elementFromPoint(x,y);
  el.style.visibility='';
  if(!under)return;
  const over=under.closest('.pitem:not(.placeholder)');
  if(over&&over!==ph){
    const r=over.getBoundingClientRect();
    over.parentNode.insertBefore(ph,(y<r.top+r.height/2)?over:over.nextSibling);
    return;
  }
  const body=under.closest('.tier-body');
  if(body&&!body.contains(ph))body.appendChild(ph);
}
/* The four groups are taller than a phone screen, so the list has to come to
   you. In the roster sheet the thing that scrolls is the sheet, not the page,
   so find whichever box the row actually lives in. */
function scrollHost(){
  let n = dragger && dragger.ph && dragger.ph.parentNode;
  while(n && n !== document.body){
    const st = getComputedStyle(n);
    if(/(auto|scroll)/.test(st.overflowY) && n.scrollHeight > n.clientHeight + 4) return n;
    n = n.parentNode;
  }
  return null;                                  // null means the page itself
}
function autoScroll(){
  if(!dragger)return;
  const edge=110, navH=80, host=scrollHost();
  const top = host ? host.getBoundingClientRect().top : 0;
  const bot = host ? host.getBoundingClientRect().bottom : innerHeight - navH;
  const y=dragger.y;
  dragger.dir = y < top+edge ? -1 : y > bot-edge ? 1 : 0;
  if(dragger.dir&&!dragger.raf){
    const step=()=>{
      if(!dragger||!dragger.dir){if(dragger)dragger.raf=null;return}
      const h=scrollHost();
      const before = h ? h.scrollTop : scrollY;
      if(h) h.scrollTop += dragger.dir*11; else scrollBy(0,dragger.dir*11);
      const after = h ? h.scrollTop : scrollY;
      if(after!==before)updateDrop();        // keep the drop target live while it moves
      dragger.raf=requestAnimationFrame(step);
    };
    dragger.raf=requestAnimationFrame(step);
  }
}
function dragEnd(){
  if(!dragger)return;
  const {el,ph}=dragger;
  dragger.dir=0; if(dragger.raf)cancelAnimationFrame(dragger.raf);
  document.removeEventListener('pointermove',dragMove);
  document.removeEventListener('pointerup',dragEnd);
  document.removeEventListener('pointercancel',dragEnd);
  document.removeEventListener('touchmove',blockScroll);
  ph.parentNode.insertBefore(el,ph);
  ph.remove();
  el.classList.remove('lifted');
  el.style.cssText='';
  const commit=dragger.commit||commitOrder;
  dragger=null;
  commit();
}
function commitOrder(){          // the DOM is the new truth: read it back into state
  const order=[];
  document.querySelectorAll('#plist .tier').forEach(sec=>{
    const tier=sec.dataset.tier;
    sec.querySelectorAll('.pitem:not(.placeholder)').forEach(el=>{
      const p=P(el.dataset.id); if(p){p.tier=tier;order.push(p)}
    });
  });
  if(order.length===S.players.length)S.players=order;
  sortByTier();
  rosterSync();                   // the roster remembers what she just decided
  render();
}

function addPlayer(){
  let el=$('#newName');if(!el)return;
  const name=el.value.trim();if(!name)return;
  if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('That name is already in the list',1);return}
  // qg = queue games (ordering only, reset on return from away).
  // games on the leaderboard is derived from history and is never touched.
  /* Someone who has played here before keeps the level and the place the
     host already gave them -- that is the whole point of the roster. Only a
     genuinely new name needs placing, and that one goes in at number one,
     where the eye already is, one drag from anywhere. */
  const known = rosterGet(name);
  const entry = {id:uid(), name: known ? known.name : name,
                 tier: known ? known.tier : 'new', away:false,
                 qg:minQueueGames(), lastPlayed:(S.matches||[]).length};
  if(known){
    const ord = S.roster.map(r=>rkey(r.name));
    const at = S.players.findIndex(p => ord.indexOf(rkey(p.name)) > ord.indexOf(rkey(name)));
    at < 0 ? S.players.push(entry) : S.players.splice(at, 0, entry);
  } else {
    S.players.unshift(entry);
    rosterAdd(name, 'new');
  }
  sortByTier(); rosterSync();
  el.value='';
  // The new arrival may be the fourth who makes another court possible --
  // open it now rather than at the end of somebody else's match.
  if(S.started)fillCourts();
  render();el=$('#newName');if(el)el.focus();
}
/* ---------------- paste a group message ---------------------------------
   A mabar post is mostly not players: date, price, venue, payment, a
   cancellation policy, then one numbered list for the mabar and often two
   more for coaching, each closed off with a row of crosses. Read the lists,
   keep them apart, let the host say which one is tonight.
   Real posts also carry invisible WORD JOINERs between the number and the
   name, ticks and stars for who has paid, "+1" for a guest, and bracketed
   notes like "(tmn clarisa)". All of that has to come off. */
const PASTE_INVIS = /[\u200B-\u200D\u2060\uFEFF]/g;
const PASTE_EMOJI = /[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2300}-\u{27BF}\u{FE0F}\u{1F3FB}-\u{1F3FF}]/gu;
const PASTE_END   = /^[\s\u274C\u2716\u2717\u2718x]{2,}$/i;
const PASTE_NUM   = /^\s*\(?(\d{1,3})\s*[.)\]:]\s*/;
const PASTE_LET   = /\p{L}/gu;
const PASTE_LABEL = /\b(player|pemain|peserta|coaching|mabar|main|list|daftar)\b/i;

function parseRoster(text){
  const lines = String(text||'').replace(PASTE_INVIS,'').split('\n');
  const lists = []; let cur = null, recent = [];
  const close = () => { if(cur && cur.names.length) lists.push(cur); cur = null; };
  const titleFor = () => {
    const hit = recent.filter(l => PASTE_LABEL.test(l)).pop();
    return (hit || recent[recent.length-1] || 'List').replace(/\s*:\s*$/,'').trim();
  };
  lines.forEach(raw => {
    const line = raw.replace(/\s+$/,'');
    const bare = line.replace(PASTE_EMOJI,'').trim();
    if(PASTE_END.test(bare)){ close(); recent = []; return; }
    const m = line.match(PASTE_NUM);
    if(m){
      let n = line.slice(m[0].length).replace(PASTE_EMOJI,'')
        .replace(/\([^)]*\)/g,' ').replace(/[*\u2022]+/g,' ')
        .replace(/\s+/g,' ').trim();
      /* "15.00 -17.00" is a time, and looks exactly like entry number 15.
         A person's name has letters in it; a time does not. */
      if((n.match(PASTE_LET)||[]).length < 2) return;
      if(n.length > 24) n = n.slice(0,24).trim();
      if(!cur) cur = {title:titleFor(), names:[], seen:new Set()};
      const k = rkey(n);
      if(cur.seen.has(k)) return;
      cur.seen.add(k); cur.names.push(n);
      return;
    }
    if(bare){
      if(cur){ close(); recent = []; }
      if(!/^https?:/i.test(bare) && bare.length < 44 && (bare.match(PASTE_LET)||[]).length >= 3){
        recent.push(bare); if(recent.length > 4) recent.shift();
      }
    }
  });
  close();
  return lists;
}

/* Two names one letter apart, or one the start of the other, are probably the
   same person typed twice -- "Micheal"/"Michael", "Wil"/"Wilsey". Probably is
   not certainly, so this only ever ASKS. Merging silently would quietly weld
   two real people together and there would be no way back. */
function nearMatch(name){
  const a = rkey(name);
  if(a.length < 3) return null;
  let best = null;
  (S.roster||[]).forEach(r => {
    const b = rkey(r.name);
    if(b === a) return;
    let hit = false;
    if(b.length >= 3 && (b.startsWith(a) || a.startsWith(b)) && Math.abs(a.length-b.length) <= 4) hit = true;
    else if(Math.abs(a.length-b.length) <= 1 && lev1(a,b)) hit = true;
    if(hit && !best) best = r.name;
  });
  return best;
}
function lev1(a,b){                     // true when one edit apart, no more
  if(a === b) return false;
  if(a.length === b.length){
    const diff = [];
    for(let i=0;i<a.length;i++) if(a[i]!==b[i]){ diff.push(i); if(diff.length > 2) return false; }
    if(diff.length === 1) return true;
    /* Michael / Micheal: two letters swapped is ONE slip of the thumb, even
       though it reads as two substitutions. */
    return diff.length === 2 && diff[1] === diff[0]+1 &&
           a[diff[0]] === b[diff[1]] && a[diff[1]] === b[diff[0]];
  }
  const [s1,s2] = a.length < b.length ? [a,b] : [b,a];
  let i = 0, j = 0, d = 0;
  while(i < s1.length && j < s2.length){
    if(s1[i] === s2[j]){ i++; j++; }
    else { if(++d > 1) return false; j++; }
  }
  return true;
}

/* The sheet's DOM is the new truth, exactly as it is for the lineup. */
function commitRoster(){
  const next = [];
  document.querySelectorAll('#rlist .tier').forEach(sec => {
    const tier = sec.dataset.tier;
    sec.querySelectorAll('.pitem:not(.placeholder)').forEach(el => {
      const r = (S.roster||[]).find(x => rkey(x.name) === el.dataset.id);
      if(r){ r.tier = tier; next.push(r); }
    });
  });
  if(next.length === (S.roster||[]).length) S.roster = next;

     next rosterSync() would quietly push the old level back over it. */
  S.players.forEach(p => { const r = rosterGet(p.name); if(r) p.tier = r.tier; });
  sortByTier();
  if(S.started) fillCourts();
  render();
  rosterDialog();

function pasteDialog(){

function pasteRead(v){ PASTE.text = v; PASTE.lists = parseRoster(v); PASTE.pick = 0; PASTE.drop = new Set(); renderPaste(); }
function pastePick(i){ PASTE.pick = i; PASTE.drop = new Set(); renderPaste(); }
function pasteDrop(n){ PASTE.drop.add(rkey(n)); renderPaste(); }
function pasteNames(){

}
function renderPaste(){

      </div>

            onclick="pasteMerge('${esc(n).replace(/'/g,"\\'")}','${esc(m).replace(/'/g,"\\'")}')">Same person</button>`).join('<br>')}

/* "Same person": the pasted spelling is dropped and the known name used. */
function pasteMerge(from, to){
  PASTE.drop.add(rkey(from));
  if(!pasteNames().some(n => rkey(n) === rkey(to))){
    const l = PASTE.lists[PASTE.pick];
    if(l) l.names.push(to);
    PASTE.drop.delete(rkey(to));
  }
  renderPaste();
}
function pasteApply(){
  const names = pasteNames();
  if(!names.length) return;
  let added = 0, seen = 0;
  /* New names go in at the top as ONE block, in the order they were pasted.
     Adding them one at a time would unshift each in turn and hand the host
     her list backwards -- the last name in the message arriving at number one. */
  const fresh = names.filter(n => !rosterGet(n)).map(n => ({name:String(n).trim(), tier:'new'}));
  if(fresh.length) S.roster = fresh.concat(S.roster || []);
  names.forEach(n => {
    if(S.players.some(p => rkey(p.name) === rkey(n))){ seen++; return; }
    const e = rosterGet(n);
    S.players.push({id:uid(), name:e.name, tier:e.tier, away:false,
                    qg:minQueueGames(), lastPlayed:(S.matches||[]).length});
    added++;
  });
  /* Tonight's list is always shown in roster order. */
  const ord = S.roster.map(r => rkey(r.name));
  S.players.sort((a,b) => ord.indexOf(rkey(a.name)) - ord.indexOf(rkey(b.name)));
  sortByTier(); rosterSync();
  PASTE = null; closeModal();
  if(S.started) fillCourts();
  render();
  toast(added + ' added' + (seen ? ', ' + seen + ' already here' : ''));
}

  // other three players' totals, so the leaderboard stopped adding up to
  // four games per match.

  if(S.started){
    S.courts=(S.courts||[]).map(c=>(c&&[...c.a,...c.b].includes(id))?null:c);
    fillCourts();

  if(isNaN(v)){toast('Enter a number',1);return}
  if(!S.settings.allowOverride&&(v<min||v>max)){
    toast(`${isFirstTo()?"Loser's score":'Winning score'} must be ${min}–${max} (admin override is in Settings)`,1);return}
  if(v<0||v>S.settings.total){toast('Score out of range',1);return}
  const c=courtAt(i); if(!c)return;
  applyScore(c,v);render();
}
/* ═══════════════════════════════════════════════════════════════════════
   ROLLING MODE
   Courts run independently. A court that finishes refills immediately from
   the front of the queue; the other courts carry on untouched.

   The queue decides WHO plays. The matchmaker only decides HOW they pair up.
   That separation is the whole point: nobody is ever skipped because a
   tidier match existed, which is what makes it defensible at courtside.
   ═══════════════════════════════════════════════════════════════════════ */


function onCourtSet(){
  const s = new Set();
  (S.courts || []).forEach(c => { if(c) [...c.a, ...c.b].forEach(i => s.add(i)); });
  return s;
}

/* Queue order: fewest queue-games first, then whoever has waited longest.
   `qg` is NOT the player's real game count -- see awaySet(). `lastPlayed`
   is the match index they last came off, so a smaller number means a
   longer wait. */
function queueOrder(){
  const on = onCourtSet();
  return present()
    .filter(p => !on.has(p.id))
    .sort((x, y) => (x.qg || 0) - (y.qg || 0)
                 || (x.lastPlayed || 0) - (y.lastPlayed || 0)
                 || S.players.indexOf(x) - S.players.indexOf(y))
    .map(p => p.id);
}

/* Foursome memory.
   With six Advanced and four to a court there are few combinations, so the
   same quartet reassembles again and again -- measured at 20 players: eight
   distinct foursomes across a whole session, one of them nine times, and a
   player meeting only three of the five others at his level all night.
   Remembering who has just played together, and charging for a repeat,
   breaks that up. The charge fades over QUAD_MEM matches so it nudges
   rather than forbids. */
const QUAD_MEM = 12, QUAD_W = 700;
const quadKey = ids => ids.slice().sort().join('|');
function quadStale(ids){
  const n = (S.matches||[]).length;
  const last = (S.recentQuads||{})[quadKey(ids)];
  return last == null ? 0 : Math.max(0, QUAD_MEM - (n - last));
}
function rememberQuad(ids){
  const n = (S.matches||[]).length;
  S.recentQuads = S.recentQuads || {};
  S.recentQuads[quadKey(ids)] = n;
  Object.keys(S.recentQuads).forEach(k => {
    if(n - S.recentQuads[k] > QUAD_MEM) delete S.recentQuads[k];   // keep it small
  });
}

/* Best of the three ways to split four players into two pairs. Reuses the
   same ideas as the round optimiser: avoid recent partners, keep the two
   sides close in strength. */
function pairFour(ids, st, str){
  const SPLITS = [[[0,1],[2,3]], [[0,2],[1,3]], [[0,3],[1,2]]];
  const Wp = 55 * (S.settings.partnerStrict / 3);
  /* No warm-up. The first match of the night is played as evenly as the
     last: a session has no run-up, and how competitive the games feel is the
     host's choice of Same level or Social mix, not a timer. This is the old
     "competitive" weight (.85 x 1.5), now simply the weight. */
  const Wb = 1.275 * (S.settings.balance / 3);
  const n  = S.matches ? S.matches.length : 0;

  const teamCost = (x, y) => {
    const s = st[x] || {partners:{}, lastPartner:{}};
    let p = Math.random() * 2;                       // tiny jitter: variety between equals
    const c = s.partners[y] || 0;
    if(c) p += Wp * (c * c * 3.2);
    const lp = s.lastPartner[y];
    if(lp != null) p += Wp * Math.max(0, 4 - (n - lp)) * 2.6;
    return p;
  };

  let best = null;
  SPLITS.forEach(([ai, bi]) => {
    const a = [ids[ai[0]], ids[ai[1]]], b = [ids[bi[0]], ids[bi[1]]];
    const d = Math.abs((str[a[0]] + str[a[1]]) - (str[b[0]] + str[b[1]]));
    let opp = 0;
    const Wo = 5 * (S.settings.oppStrict / 3);
    a.forEach(x => b.forEach(y => {
      const s = st[x] || {opps:{}, lastOpp:{}};
      const o = s.opps[y] || 0;
      if(o) opp += Wo * (o * o);
      const lo = s.lastOpp[y];
      if(lo != null) opp += Wo * Math.max(0, 3 - (n - lo)) * 1.2;
    }));
    const cost = teamCost(a[0], a[1]) + teamCost(b[0], b[1]) + opp + Wb * (d + d * d / 40);
    if(!best || cost < best.cost) best = { a, b, cost };
  });
  return best;                                      // {a, b, cost}
}

/* Choose WHICH four play, then how they pair.

   Fairness is absolute: anyone with fewer queue-games than the fourth in
   line is guaranteed a place. But players on the SAME number of games are
   interchangeable, and that is the freedom used to break up cliques --
   among equals, prefer the four who have seen least of each other.

   Without this the tie-break was chronological, so the four who finished
   together were reselected together, and 8 players on 2 courts never mixed. */
/* `justFinished` are the four who walked off the court being drawn. They are
   not banned here -- fillCourt already removes them when the pool is deep
   enough -- but they must never be chosen AHEAD of somebody with fewer games.
   That is the host's rule: "always cycles through in order of least games
   played". */
function chooseFour(order, st, str, justFinished){
  const jfSet = new Set(justFinished || []);
  if(order.length < 4) return null;
  /* Everything below assumes `order` is in games-played order: the must/flex
     split takes qg(order[3]) as the cut and keeps only players at or under it,
     so an unsorted queue can leave fewer than four candidates -- and pairFour
     then hands back a court with null players, which every renderer and
     stats() happily dereferences. Sort defensively. The sort is stable and
     callers already sort, so in practice this costs nothing and changes
     nothing; it just stops a future caller building a broken court. */
  order = order.slice().sort((a,b) =>
      (P(a) ? (P(a).qg || 0) : 0) - (P(b) ? (P(b).qg || 0) : 0)
   || (P(a) ? (P(a).lastPlayed || 0) : 0) - (P(b) ? (P(b).lastPlayed || 0) : 0));
  const n  = S.matches ? S.matches.length : 0;
  const qg = id => (P(id) ? (P(id).qg || 0) : 0);
  const level = S.settings.pairing === 'level';

  // Same level: skill rank is the player's position in the skill order, so
  // four players who sit close together in that list are a same-level court.
  // Spread is what makes 1 Advanced + 1 Beginner vs 2 Intermediate -- a
  // match the balance term actually LIKES, because the totals cancel, while
  // being a bad game for both ends of it.
  const rank = {}; S.players.forEach((pl,i)=>rank[pl.id]=i);
  const spreadCost = four => {
    if(!level) return 0;
    const r = four.map(id=>rank[id]);
    const gap = Math.max(...r) - Math.min(...r);
    return gap * gap * 1.4;        // squared: borrowing one neighbour is
  };                               // cheap, reaching across the list is not

  // ── Same level ──────────────────────────────────────────────────────
  // Synchronised mode gets same-level courts by chunking the skill order.
  // Do the same to the queue: sort who is free by skill rank, then take the
  // best CONTIGUOUS window of four. Contiguity is what guarantees a court of
  // Advanced, or -- when only two Advanced are free -- Advanced plus the two
  // nearest below them, rather than an Advanced beside a Beginner.
  // Fairness still leads: the window is chosen mostly on games played.
  /* Windows only work when there are enough of them.
     A window is four CONTIGUOUS players in the skill order, so a free pool of
     L gives L-3 windows -- and a player at rank r sits in every one of them
     when r <= 3 and r >= L-4, which is possible exactly while L <= 7. At that
     size the optimiser cannot leave that player out however many games they
     have played, because there is no window without them. Measured at seven
     players: #4 played all sixty matches and never once sat down, while #1
     and #7 played twenty-four. Five and six players are worse still.
     Below the threshold we fall through to the general selection, which is
     fairness-first and still applies spreadCost() to keep the four close in
     skill -- grouping by preference rather than by construction. */
  const WINDOW_MIN = 8;          // need at least this many free for windows
  if(level && order.length >= WINDOW_MIN){
    const byRank = order.slice().sort((a,b)=>rank[a]-rank[b]);
    // Whoever is at the front of the fairness queue plays, full stop. The
    // window is chosen AROUND them. Without this hard floor, skill grouping
    // can quietly leave one person sitting while the tidier courts form.
    // Whoever is at the front of the fairness queue should play -- but not
    // at any price. With six Advanced and four Beginners free, forcing the
    // front player in builds Advanced-beside-Beginner, when the obvious
    // answer is to play the four Beginners and let the Advanced wait for
    // their own level. So excluding the front player is expensive, and a
    // wide tier gap is more expensive still.
    const front = order[0];
    let best = null;
    let legal = 0;
    for(let i = 0; i + 4 <= byRank.length; i++){
      const four = byRank.slice(i, i + 4);
      /* Nobody plays ahead of somebody with fewer games. The general branch
         below enforces this as a hard split; this branch only PRICED it, at
         qsum*1000 per stolen game, and gap*gap*800 plus the front-of-queue
         charge routinely outbid that. Measured at 16 players on 3 courts:
         three players who had just walked off went straight back on while
         three others sat on zero games. It is the host's complaint exactly,
         and it needs a rule, not a weight. */
      {
        const inFour = new Set(four);
        let minOut = Infinity;
        order.forEach(id => { if(!inFour.has(id) && qg(id) < minOut) minOut = qg(id); });
        if(four.some(id => qg(id) > minOut)) continue;
      }
      legal++;
      const qsum = four.reduce((t,id)=>t+qg(id), 0);
      const r    = pairFour(four, st, str);
      const wait = four.reduce((t,id)=>{
        const pl = P(id); return t + (n - (pl ? (pl.lastPlayed||0) : 0));
      },0);
      const gap  = tierGap(four);
      /* Leaving the front of the queue out gets dearer the longer they have
         been sitting. A flat 2500 was no match for the gap*gap*800 charged
         for a wide court -- 7200 for a three-tier gap -- so a lone Beginner
         among Advanced, who appears in only one window and an expensive one,
         was passed over again and again: measured at seventeen matches on the
         trot without a game. Squared and capped, the charge overtakes even the
         widest gap after a handful of rotations, which bounds the wait without
         giving up skill grouping the rest of the time. */
      const frontWait = (()=>{ const pl = P(front);
        return Math.min(12, pl ? (n - (pl.lastPlayed || 0)) : 0) })();
      /* And the same charge for whoever has waited longest of everyone left
         out, because the front of the queue is not always the one stranded:
         with many players to few courts, Same level could leave somebody
         sitting for fifteen matches while the standings stayed level, where
         Social mix on the same roster left nobody more than five. */
      let outWait = 0;
      {
        const inFour = new Set(four);
        order.forEach(id => {
          if(inFour.has(id)) return;
          const pl = P(id), w = pl ? (n - (pl.lastPlayed || 0)) : 0;
          if(w > outWait) outWait = w;
        });
        if(outWait > 12) outWait = 12;
      }
      const cost = qsum * 1000
                 + (four.includes(front) ? 0 : 2500 + frontWait * frontWait * 200)
                 + outWait * outWait * 120
                 + gap * gap * 800
                 + quadStale(four) * QUAD_W
                 + r.cost - 25 * wait;
      if(!best || cost < best.cost) best = {a:r.a, b:r.b, cost};
    }
    /* Every window can be rejected -- when the players owed a game are
       scattered across the skill order, no four CONTIGUOUS players are all
       owed one. Fall through to the general branch, which is fairness-first
       by construction and still groups by skill through spreadCost(). A
       court is never left unfilled for want of a tidy window. */
    if(best) return best;
  }

  const cut  = qg(order[3]);
  const must = order.filter(id => qg(id) <  cut);
  /* In Same level the host has asked for skill grouping, so allow one extra
     game of slack when forming the pool -- without it a court of Advanced can
     never assemble and the mode cannot do its job. But the slack is NOT for
     the four who have just this second walked off: handing it to them is the
     second way a just-played player got picked over someone still waiting. */
  let   flex = order.filter(id => qg(id) === cut
                              || (level && qg(id) === cut + 1 && !jfSet.has(id)));
  const need = 4 - must.length;
  if(need <= 0)   return pairFour(order.slice(0, 4), st, str);
  if(flex.length <= need) return pairFour(must.concat(flex).slice(0, 4), st, str);

  flex = flex.slice(0, 8);                          // keep the search small

  /* Same level has to MEAN same level, down here too.
     The skill-window search above needs eight free players, and between
     4*courts+5 and 4*courts+7 the pool never reaches that -- at fourteen
     players on two courts it is always six, so the window branch never ran
     once in 240 measured draws. All that was left to group by skill was
     spreadCost(), 1.4 per rank-unit squared, which a repeated foursome at up
     to 8400 or a repeated partner at ~230 simply outbid. Measured there:
     54% of courts spanned two or more tiers, and a tighter court had been
     legally available for 48 of them. That is how an Advanced ended up
     beside a Beginner against two Intermediates in Same level.
     So: find the tightest tier gap that fairness actually permits, and
     refuse to exceed it. Fairness still leads -- the must/flex split is
     untouched, and the cap is computed from the same candidates -- and the
     cost terms still choose among the courts that tie. */
  let gapCap = 99;
  if(level){
    const probe = (start, acc) => {
      if(acc.length === need){
        const g = tierGap(must.concat(acc));
        if(g < gapCap) gapCap = g;
        return;
      }
      for(let i = start; i < flex.length; i++) probe(i + 1, acc.concat(flex[i]));
    };
    probe(0, []);
  }

  let best = null;
  const pick = (start, acc) => {
    if(acc.length === need){
      const four = must.concat(acc);
      if(level && tierGap(four) > gapCap) return;
      const r = pairFour(four, st, str);
      // Among players on equal games, variety is the tie-break -- but not an
      // unlimited one. Someone who has sat out several rotations should be
      // chosen over a slightly fresher pairing, or the optimiser can keep
      // preferring the same faces and the spread quietly widens.
      const wait = four.reduce((t,id)=>{
        const pl = P(id); return t + (n - (pl ? (pl.lastPlayed||0) : 0));
      },0);
      const cost = r.cost + spreadCost(four) + quadStale(four) * QUAD_W - 25 * wait;
      if(!best || cost < best.cost) best = {a:r.a, b:r.b, cost};
      return;
    }
    for(let i = start; i < flex.length; i++) pick(i + 1, acc.concat(flex[i]));
  };
  pick(0, []);
  return best;
}


const TIER_ORD = {new:0, adv:1, upp:2, int:3, beg:4};
const tierGap = ids => {
  const t = ids.map(id => TIER_ORD[tierOf(P(id))] ?? 2);
  return Math.max(...t) - Math.min(...t);
};
/* Fill one empty court from the front of the queue. Returns false when
   there are not four people available, which is a normal state, not an
   error -- the court simply waits. */
function fillCourt(i, justFinished){
  let order = queueOrder();

  // Clique guard.
  // With exactly courts x 4 players nobody is ever waiting, so a court that
  // finishes can only refill with the same four -- who then play together
  // all evening and never meet anyone from the other courts. Measured: at
  // 8 players on 2 courts each person met 3 of the other 7, all night.
  // So if the only candidates are the four who just left this court, and
  // another court is still playing, hold this one empty until that court
  // finishes. Both are then redrawn from the full pool. Costs a short wait;
  // buys an actual mabar instead of two sealed groups.
  if(justFinished && justFinished.length === 4 && order.length === 4){
    const jf = new Set(justFinished);
    if(order.every(id => jf.has(id)) &&
       S.courts.some((c, j) => c && j !== i)){
      S.courts[i] = null;
      return false;
    }
  }

  // No instant replay.
  // The four who just walked off are REMOVED from the candidate pool, not
  // merely pushed down it. A reorder (the old restOne setting) was useless in
  // Same level mode, because chooseFour re-sorts everyone by skill rank and
  // throws the queue order away -- so the same four kept coming straight back
  // on. Measured at 20 players on 3 courts, 60 matches: 22-29 instant replays,
  // sometimes all four of them, and the games spread reached 12.
  //
  // It yields when there is no slack. The rule needs MORE than four other
  // free players, not exactly four: with exactly four the rested court has
  // only one legal foursome, so resting becomes a rigid alternation of two
  // sealed blocks -- at 16 players on 3 courts that drove the number of
  // different people each player met from 15 down to 3. Mixing wins there,
  // which is the same call the clique guard above already makes.
  if(justFinished && justFinished.length){
    const jf = new Set(justFinished);
    const fresh = order.filter(id => !jf.has(id));
    if(fresh.length > 4) order = fresh;
  }

  if(order.length < 4){ S.courts[i] = null; return false; }

  const st = stats(), str = strengths(st);
  const got = chooseFour(order, st, str, justFinished);
  if(!got){ S.courts[i] = null; return false; }

  S.courts[i] = { a: got.a, b: got.b, winner:null, winScore:null, loseScore:null };
  rememberQuad([...got.a, ...got.b]);
  return true;
}

/* Fill every empty court, best-filled first. */
/* Four people standing on a court are playing a match, whether or not a score
   has been typed yet. Lowering the court count, or enough players going away,
   shrinks `want` -- and the old code answered that by nulling every court past
   the new limit, wiping a match in progress and dumping its four players with
   no warning. Lowering the limit now simply stops those courts being refilled;
   each one disappears when its own result is saved. */
function fillCourts(justFinished){
  const want = activeCourts();
  S.courts = S.courts || [];
  S.courts.length = Math.max(S.courts.length, want);
  for(let i = 0; i < S.courts.length; i++){
    if(i >= want) continue;                 // past the limit: let it play out
    if(savedPanel[i]) continue;             // waiting on the host's decision
    if(!S.courts[i]) fillCourt(i, justFinished);
  }
  while(S.courts.length && S.courts[S.courts.length - 1] == null &&
        S.courts.length > want && !savedPanel[S.courts.length - 1]) S.courts.pop();
}

/* A court is done: record it, send those four to the back of the queue,
   and refill that court straight away. */
function finishMatch(i){
  const c = S.courts[i];
  if(!c) return;
  if(!c.winner || (!winsOnly() && !hasScore(c))){
    toast(winsOnly()?'Tap the winning team':'Enter a winner and score for this court', 1); return; }

  S.matches = S.matches || [];
  S.matches.push({
    at: Date.now(), court: i + 1,
    a: [...c.a], b: [...c.b],
    winner: c.winner, winScore: c.winScore, loseScore: lossOf(c)
  });

  const played = [...c.a, ...c.b];
  const n = S.matches.length;
  played.forEach(id => {
    const p = P(id);
    if(p){ p.qg = (p.qg || 0) + 1; p.lastPlayed = n; }
  });

  S.courts[i] = null;
  sel = null;

  /* Saving and drawing are ONE tap. Until v65 this set a panel instead and
     waited for a second tap on "Next teams", so that two courts finishing
     close together could be drawn from one pool -- worth 6.4 to 9.8 different
     opponents for the least-mixed player at 16 players on 3 courts. The host
     asked for the panel to go: three screens to record one match is too many
     when she is doing it sixty times a night, and the single-court case was
     already drawing at once for the same reason. nextTeams() still sweeps in
     every court standing free, so two genuinely simultaneous finishes are
     still drawn together; what is lost is the deliberate pause, not the
     joint draw itself.

     The panel entry is still WRITTEN, and nextTeams deletes it on the way
     through: `played` is how the four who just finished are handed to the
     draw as just-finished, and dropping it put them straight back on court
     over people still waiting -- the original "2 orang baru main langsung
     disuruh main lagi" bug. The entry now lives for one function call and is
     never rendered.

     Nothing is confirmed any more, so the toast carries the undo. */
  const idx = S.matches.length - 1;
  const won = teamName(c.winner === 'a' ? c.a : c.b);
  savedPanel[i] = { idx, played, held: false };
  nextTeams(i);
  toast(won + ' won', 0, { label:'Undo', fn:() => undoMatch(idx, i) });
}

/* Draw this court now -- together with every court the host is holding, from
   one combined pool. This is the whole point of the pause. */
function nextTeams(i){
  /* EVERY court standing free is drawn in this one decision.
     v53 only swept in courts the host had tapped a Wait button on, which made
     two identical situations behave differently: a court she had deliberately
     held joined the joint draw, while one she had simply not got to yet did
     not -- though both were sitting there empty in front of her. Not tapping
     IS waiting; the panel is the pause. So the button went and this takes
     every free court instead, which is also what makes the joint draw happen
     by itself whenever two courts finish close together. */
  const want = activeCourts(), idxs = [], jf = [], taken = {};
  (S.courts || []).forEach((c, n) => { if(!c && n < want) idxs.push(n); });
  if(i < want && idxs.indexOf(i) < 0) idxs.push(i);
  idxs.sort((a,b) => a-b);
  idxs.forEach(n => {
    const ps = savedPanel[n];
    if(ps){ taken[n] = ps; if(ps.played) jf.push(...ps.played); }
    delete savedPanel[n];
  });
  drawCourts(idxs, jf);
  /* A court the draw could not fill keeps a card, so the host is never left
     looking at an empty court with no button on it. */
  idxs.forEach(n => {
    if(!S.courts[n])
      savedPanel[n] = Object.assign(taken[n] || {idx:null, played:null}, {held:true});
  });
  sel = null;
  render();
  const drawn = idxs.filter(n => S.courts[n]);
  if(drawn.length > 1)
    toast('Courts ' + drawn.map(n => n+1).join(' and ') + ' drawn together');
}

/* Cost of one foursome, built from the same ingredients chooseFour uses so a
   joint draw and a single draw are scored on one scale. Tier gap is only a
   cost in Same level, exactly as chooseFour has it -- charging it in Social
   quietly turns Social into Same level. */
function fourCost(four, st, str){
  const r = pairFour(four, st, str);
  if(!r) return null;
  const n = (S.matches || []).length;
  const level = S.settings.pairing === 'level';
  const qsum = four.reduce((t,id) => t + (P(id) ? (P(id).qg || 0) : 0), 0);
  const wait = four.reduce((t,id) => {
    const pl = P(id); return t + (n - (pl ? (pl.lastPlayed || 0) : 0)); }, 0);
  const gap  = level ? tierGap(four) : 0;
  return { a:r.a, b:r.b,
    cost: qsum*1000 + gap*gap*800 + quadStale(four)*QUAD_W + r.cost - 25*wait };
}

/* The candidate pool for a draw that needs `need` players at once.
   The no-instant-replay rule generalises: everyone who did not just come off
   goes first, and the just-played are only topped up to reach `need`, fewest
   games first, with the queue re-sorted so chooseFour still gets it in games
   order. Note this accepts EXACTLY `need` fresh players, where the single
   court rule in fillCourt insists on more than four. Four fresh for one court
   leaves exactly one legal foursome, so resting there degenerates into two
   sealed blocks; eight fresh for two courts still leaves thirty-five ways to
   split them, so there is real choice left and no such degeneration. */
function jointOrder(need, justFinished){
  const order = queueOrder();
  if(!(justFinished && justFinished.length)) return order;
  const jf = new Set(justFinished);
  const fresh = order.filter(id => !jf.has(id));
  if(fresh.length >= need) return fresh;
  const stale = order.filter(id => jf.has(id));
  const q = id => (P(id) ? (P(id).qg || 0) : 0);
  const lp = id => (P(id) ? (P(id).lastPlayed || 0) : 0);
  return fresh
    .concat(stale.slice().sort((a,b) => q(a)-q(b)).slice(0, need - fresh.length))
    .sort((a,b) => q(a)-q(b) || lp(a)-lp(b));
}

/* Two empty courts, one decision. Filling them one at a time is first come
   first served: the first court takes the four that suit it and the second
   gets the leftovers. Choosing both together costs a little search and gets
   two sensible courts instead of one good and one poor. */
function drawTwo(i, j, order, st, str){
  const pool = order.slice(0, 10);          // 210 x 15 scorings, bounded
  if(pool.length < 8) return false;
  /* Same rule as chooseFour: of these ten, the eight who play must be the
     eight with fewest games. Without this the scorer was free to leave a
     player on fewer games sitting because the arithmetic liked someone else,
     which is the queue-jump the host reported, reached by the other path. */
  const qg = id => (P(id) ? (P(id).qg || 0) : 0);
  const fair = eight => {
    const inEight = new Set(eight);
    let minOut = Infinity;
    pool.forEach(id => { if(!inEight.has(id) && qg(id) < minOut) minOut = qg(id); });
    return !eight.some(id => qg(id) > minOut);
  };
  const fours = [];
  for(let a=0;a<pool.length;a++)for(let b=a+1;b<pool.length;b++)
    for(let c=b+1;c<pool.length;c++)for(let d=c+1;d<pool.length;d++)
      fours.push([pool[a],pool[b],pool[c],pool[d]]);
  let best = null;
  fours.forEach(fa => {
    const sa = fourCost(fa, st, str); if(!sa) return;
    const inA = new Set(fa);
    const rest = pool.filter(x => !inA.has(x));
    let bb = null;
    for(let e=0;e<rest.length;e++)for(let f=e+1;f<rest.length;f++)
      for(let g=f+1;g<rest.length;g++)for(let h=g+1;h<rest.length;h++){
        const sb = fourCost([rest[e],rest[f],rest[g],rest[h]], st, str);
        if(sb && (!bb || sb.cost < bb.cost)) bb = sb;
      }
    if(!bb) return;
    if(!fair([...sa.a, ...sa.b, ...bb.a, ...bb.b])) return;
    const tot = sa.cost + bb.cost;
    if(!best || tot < best.tot) best = { tot, A:sa, B:bb };
  });
  if(!best) return false;
  S.courts[i] = { a:best.A.a, b:best.A.b, winner:null, winScore:null, loseScore:null };
  S.courts[j] = { a:best.B.a, b:best.B.b, winner:null, winScore:null, loseScore:null };
  rememberQuad([...best.A.a, ...best.A.b]);
  rememberQuad([...best.B.a, ...best.B.b]);
  return true;
}

/* Draw the given courts. Two go together; a third and beyond fall back to one
   at a time, which keeps the search bounded and is rare in practice. */
function drawCourts(idxs, justFinished){
  const want = activeCourts();
  const list = idxs.filter(i => i < want).sort((a,b) => a-b);
  if(!list.length) return;
  if(list.length === 1){ fillCourt(list[0], justFinished); return; }
  const st = stats(), str = strengths(st);
  if(!drawTwo(list[0], list[1], jointOrder(8, justFinished), st, str)){
    list.forEach(i => fillCourt(i, justFinished));
    return;
  }
  for(let k = 2; k < list.length; k++) fillCourt(list[k], justFinished);
}

/* Undo one saved match, by index -- not merely the newest one, since another
   court may have finished in between. Reached from the toast that appears on
   save, which is the only chance to take back a mis-tap now that the result
   panel is gone; afterwards the match is editable from History as before.

   The four who played go back ON to the court, exactly as they were. The four
   the draw has just put there were never recorded as having played -- qg is
   only touched here, on save -- so dropping them costs nothing but the draw,
   and the host sees the match she is undoing rather than a fresh set of
   strangers. */
function undoMatch(idx, i){
  const ms = S.matches || [];
  const m = ms[idx];
  if(!m){ toast('That match is already gone', 1); return; }
  ms.splice(idx, 1);
  [...m.a, ...m.b].forEach(id => {
    const p = P(id);
    if(p){ if(p.qg) p.qg--; p.lastPlayed = Math.min(p.lastPlayed || 0, ms.length); }
  });
  // every panel pointing past the removed match shifts down with it
  Object.keys(savedPanel).forEach(k => {
    if(savedPanel[k].idx === idx) delete savedPanel[k];
    else if(savedPanel[k].idx > idx) savedPanel[k].idx--;
  });
  delete savedPanel[i];
  S.courts[i] = { a:[...m.a], b:[...m.b], winner:null, entering:false };
  sel = null;
  save(); render(); toast('Match undone');
}

/* Away. The host decides; the system simply stops picking them.
   On return a player rejoins level with whoever present has played least,
   so a late arrival does not play four in a row while the regulars watch.
   Their true `games` count, and therefore the leaderboard, is untouched. */
function setAway(id, away){
  const p = P(id); if(!p) return;

  /* Marking someone away while they are standing on a court used to do
     nothing visible: it set the flag, then called fillCourts(), which only
     ever FILLS empty courts and never takes anyone off one. So the host saw
     the player still playing and reported that Away was broken. Ask instead,
     because the two sensible answers are genuinely different -- a player
     leaving early can finish the game, an injury cannot -- and redrawing
     silently would throw away a score already entered on that court. */
  if(away && S.started){
    const ci = (S.courts || []).findIndex(c => c && [...c.a, ...c.b].includes(id));
    if(ci >= 0){ awayOnCourtDialog(id, ci); return; }
  }

  applyAway(id, away);
}

/* The actual state change, once the court question is settled. */
function applyAway(id, away){
  const p = P(id); if(!p) return;
  p.away = !!away;
  if(!away){
    const others = present().filter(x => x.id !== id);
    p.qg = others.length ? Math.min(...others.map(x => x.qg || 0)) : 0;
    p.lastPlayed = S.matches ? S.matches.length : 0;
  }
  if(S.started) fillCourts();
  render();
  toast(away ? p.name + ' is away' : p.name + ' is back');
}

/* Away while on court. `ci` is the court index. */
function awayOnCourtDialog(id, ci){
  const p = P(id); if(!p) return;
  const where = 'court ' + (ci + 1);
  modal(`<h3 style="margin-bottom:6px">${esc(p.name)} is playing</h3>
    <div class="muted" style="margin-bottom:18px">They are on ${where} right now.
      Either way they will not be picked again until you bring them back.</div>
    <button class="btn pri full" onclick="awayAfterMatch('${id}')">Let that match finish</button>
    <button class="btn dan full" style="margin-top:10px"
      onclick="awayRedraw('${id}',${ci})">Take them off and redraw</button>
    <button class="btn gho full" style="margin-top:10px" onclick="closeModal()">Cancel</button>`);
}
/* Leaving early: nothing in progress is disturbed, and present() keeps them
   out of every future pick. */
function awayAfterMatch(id){
  closeModal();
  applyAway(id, true);
  toast(P(id).name + ' is away after this match');
}
/* Injury: the court goes back to the queue and is drawn again without them.
   Any score typed on that court is lost, which is why this was never silent. */
function awayRedraw(id, ci){
  closeModal();
  const p = P(id);
  p.away = true;
  S.courts[ci] = null;
  fillCourts();
  render();
  toast(p.name + ' is away \u2014 court ' + (ci + 1) + ' redrawn');
}

function minQueueGames(){
  const o = (S.players||[]).filter(p=>!p.away);
  return o.length ? Math.min(...o.map(p=>p.qg||0)) : 0;
}

/* ---- drag & drop + input wiring ---- */
function wire(){
  const nn=$('#newName');
  if(nn)nn.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addPlayer()}};

  wirePlayerDrag();
  document.querySelectorAll('[data-pid]').forEach(el=>{
    if(!el.getAttribute('draggable'))return;
    el.ondragstart=e=>{dragId=el.dataset.pid;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','x')}catch(_){}}
    el.ondragover=e=>{e.preventDefault();el.classList.add('over')};
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{e.preventDefault();el.classList.remove('over');
      if(dragId&&typeof dragId==='string'&&dragId!==el.dataset.pid){sel=dragId;tapRolling(el.dataset.pid)}
      dragId=null};
  });
}

load();render();

// installed / offline support (no-op when opened straight off the filesystem)
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',async()=>{
    // an installed app resumes rather than relaunches, so it would otherwise sit on
    // an old build forever. Check for a new one every launch and swap to it.
    const had=!!navigator.serviceWorker.controller;
    let reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(had&&!reloading){reloading=true;location.reload()}
    });
    try{
      const reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
      reg.update();
      setInterval(()=>reg.update(),60*60*1000);
    }catch(_){}
  });
}
</script>
<script>
"use strict";
/* =========================================================================
   ACCESS GATE
   ------------------------------------------------------------------------
   The app itself stays offline-first: everything below only decides whether
   the gate is lifted. Once it is, not a single rally depends on the network.

   Honest limit: this is a lock on the front door of a building whose data
   lives inside the visitor's own phone. Someone who opens developer tools
   can remove the overlay. What they CANNOT do is exceed the free player cap
   or grant themselves premium -- those are enforced by the database. This
   gate stops ordinary sharing, not a determined engineer.
   ========================================================================= */
(function(){
  const SUPA = 'https://ubgabydmcjwqfsffvwoz.supabase.co';
  const PKEY = 'sb_publishable_R8HZkFXpwUlHvRkFlCLq5A_P2wGXmcY';
  const AUTH_LS = 'badminton_auth_v1';
  const DEV_LS  = 'badminton_device_v1';
  const GRACE_DAYS = 3;          // offline tolerance before the app locks
  const RECHECK_MS = 5*60*1000;  // how often to re-ask while open

  const $g = s => document.querySelector(s);
  const gate = $g('#gate'), gBody = $g('#gBody'), acctBtn = $g('#acctBtn');

  // Single place that decides whether the app exists on the page at all.
  const setGate = on => {
    gate.hidden = !on;
    document.documentElement.classList.toggle('gated', on);
    if(on) window.scrollTo(0,0);
  };

  let A = null;   // {access_token, refresh_token, expires_at, id, email}
  let C = null;   // {allowed, plan, expires_at, suspended, checkedAt}

  const read = k => { try{ return JSON.parse(localStorage.getItem(k)||'null') }catch(_){ return null } };
  const write = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)) }catch(_){} };
  const drop = k => { try{ localStorage.removeItem(k) }catch(_){} };

  /* ── device identity ──────────────────────────────────────────────────
     A random id per browser. It identifies the DEVICE, never the person,
     and carries nothing that could single anybody out. */
  function deviceKey(){
    let d = null;
    try{ d = localStorage.getItem(DEV_LS) }catch(_){}
    if(!d){
      d = (crypto.randomUUID ? crypto.randomUUID()
          : 'd'+Date.now()+Math.random().toString(36).slice(2));
      try{ localStorage.setItem(DEV_LS, d) }catch(_){}
    }
    return d;
  }
  /* The session this device is signed in on. GoTrue puts session_id in the
     access token; reporting it lets the dashboard end THIS device's session
     without touching the host's other devices. */
  function sessionId(){
    try{
      const b = A.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      return JSON.parse(atob(b)).session_id || null;
    }catch(_){ return null; }
  }

  async function deviceLabel(){
    const u = navigator.userAgent;
    let os = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad'
           : /Android/.test(u) ? 'Android' : /Mac OS X/.test(u) ? 'Mac'
           : /Windows/.test(u) ? 'Windows' : 'Other';
    const br = /CriOS/.test(u) ? 'Chrome' : /FxiOS|Firefox/.test(u) ? 'Firefox'
             : /Edg/.test(u) ? 'Edge' : /Chrome/.test(u) ? 'Chrome'
             : /Safari/.test(u) ? 'Safari' : '';
    let model = '', ver = '';

    // Apple reports no model at all, so two iPhone 15s look identical here.
    // The OS version and the screen size are the only things that ever
    // differ between them, and only sometimes -- the short device code in
    // the dashboard is what actually separates them.
    const m = u.match(/(?:iPhone |CPU )?OS (\d+)[_.](\d+)/);
    if(m) ver = m[1] + '.' + m[2];

    try{
      const uad = navigator.userAgentData;
      if(uad && uad.getHighEntropyValues){
        const h = await uad.getHighEntropyValues(['platform','platformVersion','model']);
        if(h.platform) os = h.platform;
        if(h.platformVersion) ver = String(h.platformVersion).split('.').slice(0,2).join('.');
        if(h.model) model = h.model;
      }
    }catch(_){}

    let size = '';
    try{
      const w = Math.min(screen.width, screen.height), hh = Math.max(screen.width, screen.height);
      if(w && hh) size = w + '×' + hh;
    }catch(_){}

    const standalone = window.matchMedia &&
      matchMedia('(display-mode: standalone)').matches ? 'installed' : '';

    return [model, os + (ver ? ' ' + ver : ''), size, br, standalone]
      .filter(Boolean).join(' · ');
  }

  /* ── network helpers ──────────────────────────────────────────────── */
  async function sbFetch(path, opts={}){
    return fetch(SUPA+path, {
      ...opts,
      headers:{ apikey:PKEY, 'Content-Type':'application/json',
                ...(A ? { Authorization:'Bearer '+A.access_token } : {}),
                ...(opts.headers||{}) }
    });
  }

  async function refreshSession(){
    if(!A?.refresh_token) return false;
    try{
      const r = await fetch(SUPA+'/auth/v1/token?grant_type=refresh_token', {
        method:'POST', headers:{ apikey:PKEY, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token: A.refresh_token })
      });
      if(!r.ok) return false;
      const j = await r.json();
      A = { access_token:j.access_token, refresh_token:j.refresh_token,
            expires_at: Date.now() + (j.expires_in||3600)*1000,
            id: j.user?.id || A.id, email: j.user?.email || A.email };
      write(AUTH_LS, A);
      return true;
    }catch(_){ return false; }
  }

  /* ── the entitlement question ─────────────────────────────────────── */
  async function checkAccess(){
    if(!A) return { state:'anon' };

    if(A.expires_at && Date.now() > A.expires_at - 60000){
      const ok = await refreshSession();
      if(!ok && navigator.onLine) return { state:'expired' };
    }

    let rows;
    try{
      const r = await sbFetch('/rest/v1/admin_overview?select=plan,expires_at,suspended&id=eq.'+A.id);
      if(r.status === 401){
        const ok = await refreshSession();
        if(!ok) return { state:'expired' };
        return checkAccess();
      }
      if(!r.ok) throw new Error('http '+r.status);
      rows = await r.json();
    }catch(_){
      // Offline, or the server is unreachable. Fall back to what we last knew.
      if(C && C.allowed && (Date.now() - C.checkedAt) < GRACE_DAYS*864e5)
        return { state:'ok', offline:true };
      if(C && C.allowed) return { state:'grace_over' };
      return { state:'offline_unknown' };
    }

    const row = rows[0];
    if(!row) return { state:'no_account' };

    const live = !row.suspended
      && (row.plan === 'trial' || row.plan === 'active')
      && (!row.expires_at || new Date(row.expires_at).getTime() > Date.now());

    C = { allowed:live, plan:row.plan, expires_at:row.expires_at,
          suspended:row.suspended, checkedAt:Date.now() };
    write('badminton_ent_v1', C);

    if(row.suspended) return { state:'suspended' };
    if(!live)         return { state:'lapsed', plan:row.plan };

    // Is THIS DEVICE still allowed? Asked every time the gate is considered,
    // so a removed device can never slip through on a quick re-login.
    try{
      const dq = await sbFetch('/rest/v1/devices?select=revoked&host_id=eq.' + A.id +
                               '&device_key=eq.' + encodeURIComponent(deviceKey()));
      if(dq.ok){
        const d = await dq.json().catch(() => null);
        if(d && d[0] && d[0].revoked) return { state:'device_removed' };
      }
    }catch(_){ /* offline: the heartbeat catches it when the signal returns */ }

    return { state:'ok' };
  }

  /* ── background bookkeeping (never blocks the UI) ──────────────────── */
  let lastTouch = 0;
  async function touch(){
    if(!A) return;
    // Heartbeat, not a tracker. Every five minutes while the app is open is
    // enough for the dashboard to show who is active; switching tabs twenty
    // times a minute should not write twenty rows.
    if(Date.now() - lastTouch < 50000) return;
    lastTouch = Date.now();
    const now = new Date().toISOString();
    try{
      const dr = await sbFetch('/rest/v1/devices?on_conflict=host_id,device_key', {
        method:'POST',
        headers:{ Prefer:'resolution=merge-duplicates,return=representation' },
        body: JSON.stringify({ host_id:A.id, device_key:deviceKey(),
                               session_id:sessionId(),
                               label:(await deviceLabel()), last_seen:now })
      });
      // The row comes back, so the same request that says "still here" also
      // tells us whether we are still welcome. No extra round trip.
      if(dr.ok){
        const back = await dr.json().catch(() => null);
        if(back && back[0] && back[0].revoked){ removedHere(); return; }
      }
      await sbFetch('/rest/v1/hosts?id=eq.'+A.id, {
        method:'PATCH', body: JSON.stringify({ last_seen_at: now }) });
    }catch(_){}
  }

  /* ── screens ──────────────────────────────────────────────────────── */
  const SIGNIN_HTML = gBody.innerHTML;

  function showSignIn(msg){
    gBody.innerHTML = SIGNIN_HTML;
    if(msg) $g('#gErr').innerHTML = '<div class="gerr">'+msg+'</div>';
    setGate(true); acctBtn.hidden = true;
    wireForm();
  }

  function showLocked(title, body, showRetry){
    gBody.innerHTML =
      '<h1 class="gtitle">'+title+'</h1>'+
      '<p class="gsub">'+body+'</p>'+
      '<div class="gstack">'+
        (showRetry ? '<button type="button" id="gRetry">Try again</button>' : '')+
        '<button type="button" id="gOut">Sign out</button>'+
      '</div>';
    setGate(true); acctBtn.hidden = true;
    const rt = $g('#gRetry'); if(rt) rt.onclick = () => boot(true);
    $g('#gOut').onclick = signOut;
  }

  function openApp(){
    setGate(false); acctBtn.hidden = false;
    touch();
  }

  /* The organiser removed this device. The session is already dead server
     side; all that is left is to stop pretending otherwise. Nothing local is
     deleted -- the roster and results stay, and signing back in restores them. */
  function removedHere(){
    lastTouch = 0;                       // so the next check is never skipped
    boot(false);                         // one road to the locked screen
  }

  function signOut(){
    A = null; C = null; lastTouch = 0;   // a fresh sign-in re-checks the device
    drop(AUTH_LS); drop('badminton_ent_v1');
    showSignIn('');
  }

  acctBtn.onclick = () => {
    const who = A?.email || '';
    const plan = C ? (C.suspended ? 'suspended'
                  : C.plan === 'active' ? 'Premium'
                  : C.plan === 'trial'  ? 'Trial' : C.plan) : '';
    showLocked('Signed in',
      who + (plan ? '<br>Plan: <b>'+plan+'</b>' : ''), false);
    $g('#gBody').insertAdjacentHTML('beforeend',
      '<div class="gstack" style="margin-top:9px">'+
      '<button type="button" id="gBack">Back to the app</button></div>');
    $g('#gBack').onclick = () => { setGate(false); acctBtn.hidden = false; };
  };

  /* ── sign in ──────────────────────────────────────────────────────── */
  function stampBuild(){
    const el = $g('#gBuild'); if(!el) return;
    const standalone = (window.matchMedia &&
      matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    el.textContent = (typeof BUILD === 'string' ? BUILD : '?') +
      ' \u00b7 ' + (standalone ? 'installed' : 'browser');
  }

  function wireForm(){
    const f = $g('#gForm'); if(!f) return;
    stampBuild();
    const eye = $g('#gEye'), pwf = $g('#gPass');
    if(eye && pwf) eye.onclick = () => {
      const hidden = pwf.type === 'password';
      pwf.type = hidden ? 'text' : 'password';
      eye.textContent = hidden ? 'HIDE' : 'SHOW';
    };
    f.onsubmit = async e => {
      e.preventDefault();
      const btn = $g('#gBtn'), em = $g('#gEmail').value.trim(), pw = $g('#gPass').value;
      btn.disabled = true; btn.textContent = 'Signing in…';
      $g('#gErr').innerHTML = '';
      try{
        const r = await fetch(SUPA+'/auth/v1/token?grant_type=password', {
          method:'POST', headers:{ apikey:PKEY, 'Content-Type':'application/json' },
          body: JSON.stringify({ email:em, password:pw })
        });
        const j = await r.json();
        if(!r.ok) throw new Error(
          /Invalid login/i.test(j.error_description||j.msg||'')
            ? 'That email and password don’t match an account.'
            : (j.error_description || j.msg || 'Could not sign in.'));

        A = { access_token:j.access_token, refresh_token:j.refresh_token,
              expires_at: Date.now() + (j.expires_in||3600)*1000,
              id:j.user.id, email:j.user.email };
        write(AUTH_LS, A);

        // A different host on this phone starts with a clean sheet -- the
        // previous roster belongs to the previous account, not to them.
        const last = localStorage.getItem('badminton_last_email');
        if(last && last !== A.email){ drop('badminton_rotation_v1'); }
        try{ localStorage.setItem('badminton_last_email', A.email) }catch(_){}

        await boot(true);
      }catch(err){
        $g('#gErr').innerHTML = '<div class="gerr">'+
          String(err.message).replace(/[<>]/g,'')+'</div>';
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    };
  }

  /* ── boot / recheck ───────────────────────────────────────────────── */
  async function boot(reloadState){
    A = read(AUTH_LS); C = read('badminton_ent_v1');
    if(!A){ showSignIn(''); return; }

    const res = await checkAccess();
    switch(res.state){
      case 'ok':
        if(reloadState && typeof load === 'function' && typeof render === 'function'){
          load(); render();
        }
        openApp();
        break;
      case 'device_removed':
        showLocked('This device was removed',
          'The organiser removed access for this device. Nothing on it has been '+
          'deleted. Ask them to restore it, or sign in on another device.', true);
        break;
      case 'suspended':
        showLocked('Access paused',
          'Your account has been paused by the organiser. Your players and history are safe — contact them to restore access.', true);
        break;
      case 'lapsed':
        showLocked('Subscription ended',
          'This account no longer has an active plan. Contact the organiser to renew — nothing has been deleted.', true);
        break;
      case 'grace_over':
        showLocked('Connect to continue',
          'The app has been offline for more than '+GRACE_DAYS+' days and needs to check your plan once. Find signal or wifi and try again.', true);
        break;
      case 'offline_unknown':
        showLocked('No connection',
          'Sign in needs the internet the first time. After that the app works offline.', true);
        break;
      case 'no_account':
        showLocked('Account not set up',
          'This login exists but has no plan attached. Contact the organiser.', true);
        break;
      default:
        showSignIn(res.state === 'expired'
          ? 'Your session expired. Please sign in again.' : '');
    }
  }

  // Re-ask periodically and whenever the phone comes back to the app, so a
  // revoked plan bites within minutes rather than at the next cold start.
  setInterval(() => { if(A && gate.hidden) boot(false); }, RECHECK_MS);
  // The heartbeat doubles as the removal check, so a device that has had its
  // access removed falls to the sign-in screen within about a minute.
  setInterval(() => { if(A && gate.hidden) touch(); }, 60000);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && A) boot(false);
  });
