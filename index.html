:root{
  color-scheme:light;
  --court:#0E8A4F; --court-d:#0A6B3D; --court-l:#15A75F; --court-x:#073D23;
  --lime:#B9F27C; --limeink:#2C5416;
  --white:#fff; --ground:#F1F7F0; --card:#fff;
  --ink:#0F2419; --ink2:#4A6553; --ink3:#8FA899;
  --line:#DBE8DC; --line2:#C6DCC9;
  --red:#E23B3B; --red-d:#B82A2A; --red-l:#FFECEC;
  --gold:#F2B705;
  /* the highlight behind somebody who is in the hall tonight */
  --hi:#D6F7E0; --hi-b:#8EDCA8; --hi-b2:#6FCB8F;
  --aw:#FBC3C9; --aw-b:#EE8C96; --aw-b2:#E67683;
  --r:20px; --r-sm:14px; --tap:54px;
  /* skill tiers: a hue ramp, deliberately clear of the green/red/amber the UI
     already uses for good / danger / warning. Room for a 5th above Advanced. */
  --shadow:0 2px 0 var(--line2), 0 6px 18px rgba(15,36,25,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;padding:0;background:var(--ground)}   /* so nothing can paint white */
body{margin:0;padding:0}
body{
  /* every page fills the screen, so a short one cannot sit differently to a long
     one - that is what made the nav float on Game, Leaderboard and History */
  min-height:100vh; min-height:100dvh;
  background:var(--ground); color:var(--ink);
  font:16px/1.45 Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-weight:600;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%; overscroll-behavior-y:contain;
}
h1,h2,h3{margin:0;font-family:Fredoka,Nunito,sans-serif;font-weight:600;letter-spacing:-.2px}
button,input,select{font:inherit;color:inherit;font-family:inherit}
button{cursor:pointer;border:none;background:none}
input,select{background:var(--white);border:2px solid var(--line);border-radius:var(--r-sm);
  padding:13px;color:var(--ink);width:100%;font-weight:700}
input::placeholder{color:var(--ink3);font-weight:600}
input:focus,select:focus{outline:none;border-color:var(--court);box-shadow:0 0 0 4px rgba(14,138,79,.14)}
.hide{display:none!important}
:focus-visible{outline:3px solid var(--court);outline-offset:2px}

/* ---------- app bar: a court, seen from above ---------- */
header{
  position:sticky;top:0;z-index:40;color:#fff;
  background:
    linear-gradient(0deg,rgba(0,0,0,.10),rgba(0,0,0,0) 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.13) 0 2px,transparent 2px 64px),
    linear-gradient(135deg,var(--court-l),var(--court) 55%,var(--court-d));
  padding:calc(12px + env(safe-area-inset-top)) 16px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
header .ttl{font-family:Fredoka,sans-serif;font-size:22px;font-weight:600;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.82);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


main{padding:16px 14px 24px;max-width:720px;margin:0 auto}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--white);
  border-top:2px solid var(--line);display:flex;gap:2px;padding:7px 6px;
  padding-bottom:calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 -5px 20px rgba(15,36,25,.07);
}
nav button{flex:1;padding:7px 1px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--ink3);font-size:10px;font-weight:800;letter-spacing:.1px;border-radius:13px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--court);background:rgba(14,138,79,.11)}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.sec-h{font-family:Fredoka,sans-serif;font-size:13px;font-weight:600;letter-spacing:.3px;
  text-transform:uppercase;color:var(--ink2);margin:20px 4px 9px;display:flex;align-items:center;gap:7px}
.sec-h:first-child{margin-top:4px}
.sec-h::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--lime);
  border:2px solid var(--court);flex:none}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--ink2);font-size:13.5px;font-weight:600}
.mini{color:var(--ink3);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ---------- chunky buttons ---------- */
.btn{
  min-height:var(--tap);border-radius:var(--r-sm);background:var(--white);
  border:2px solid var(--line);border-bottom-width:4px;border-bottom-color:var(--line2);
  color:var(--ink);font-weight:800;padding:0 18px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;text-align:center;font-size:15px;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn.pri{background:var(--court);color:#fff;border-color:var(--court-d);border-bottom-color:var(--court-x);
  font-family:Fredoka,sans-serif;font-weight:600;font-size:17px}
.btn.dan{background:var(--white);color:var(--red);border-color:#F3CECE;border-bottom-color:#E4AFAF}
.btn.dan.solid{background:var(--red);color:#fff;border-color:var(--red-d);border-bottom-color:#8E1F1F;
  font-family:Fredoka,sans-serif;font-weight:600;font-size:17px}
.btn.gho{background:transparent;border-color:var(--line);border-bottom-width:2px;box-shadow:none}
.btn.sm{min-height:42px;font-size:13.5px;padding:0 13px;border-radius:11px}
.btn.xs{min-height:34px;font-size:12px;padding:0 11px;border-radius:9px;border-bottom-width:3px;font-weight:800}
.btn.full{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:2px solid var(--line);
  border-bottom-width:3px;border-radius:999px;padding:8px 15px;font-size:14.5px;font-weight:800}
.tag{font-size:10px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.tag.g{background:var(--lime);color:var(--limeink)}
.tag.y{background:#FFF0C9;color:#7A5A00}
.tag.r{background:var(--red-l);color:var(--red-d)}
.tag.b{background:#E2F2E7;color:var(--court-d)}
.tag.ver{background:rgba(255,255,255,.22);color:#fff;border:1.5px solid rgba(255,255,255,.45);
  letter-spacing:.4px;text-transform:none}
.note{background:#FFF8E4;border:2px solid #F3DFA6;color:#7A5A00;
  border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;font-weight:700;margin-bottom:11px}
.note.err{background:var(--red-l);border-color:#F3C9C9;color:var(--red-d)}

/* ---------- player list ---------- */
.plist{display:flex;flex-direction:column;gap:9px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--line);
  border-bottom-width:3px;border-radius:var(--r-sm);padding:9px 11px}
.pitem.drag{opacity:.35}
.pitem.over{border-color:var(--court);box-shadow:0 0 0 3px rgba(14,138,79,.17)}
.pnum{width:30px;height:30px;flex:none;border-radius:10px;background:var(--ground);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-family:Fredoka,sans-serif;font-size:13px;font-weight:600}
.pnum.s1{background:var(--lime);color:var(--limeink);box-shadow:0 0 0 2px var(--court) inset}
.pname{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15.5px}
.ibtn{width:40px;height:40px;flex:none;border-radius:11px;background:var(--ground);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:15px;font-weight:900}
.ibtn.dan{color:var(--red);background:var(--red-l);border-color:#F3CECE}
.handle{cursor:grab;color:var(--ink3);padding:0 2px;font-size:16px;letter-spacing:-2px}
[data-tier=new]{--tc:#F2B705;--tcs:#FFF6D6;--tct:#7A5A00;--tcf:#3D2A00}
[data-tier=adv]{--tc:#4A33C8;--tcs:#ECE9FC;--tct:#3A2BA8;--tcf:#fff}
[data-tier=upp]{--tc:#2878D0;--tcs:#E4EEFB;--tct:#1F5CA0;--tcf:#fff}
[data-tier=int]{--tc:#58C7EC;--tcs:#E4F6FD;--tct:#0A6E8C;--tcf:#05303F}
[data-tier=beg]{--tc:#E8A00B;--tcs:#FCF0D6;--tct:#8A5B00;--tcf:#3D2A00}
.tier .tier-n{color:var(--tct)}
.tier .tier-c{background:var(--tc);color:var(--tcf)}
.tier .pitem{border-left:7px solid var(--tc)}
.tier .pnum{background:var(--tcs);color:var(--tct)}
.tier .pnum.s1{background:var(--tcs);color:var(--tct);box-shadow:0 0 0 2px var(--tc) inset}
.tdot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--tc);display:inline-block}
.tierpick button[data-tier]{border-bottom-color:var(--tc)}
.tierpick button[data-tier].on{background:var(--tc);color:var(--tcf);border-color:var(--tc)}
.grip{margin-left:auto;flex:none;width:46px;height:46px;margin-right:-6px;display:flex;
  align-items:center;justify-content:center;color:var(--ink3);border-radius:12px;
  touch-action:none;cursor:grab}
.grip:active{background:var(--ground);cursor:grabbing}
.grip svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
#plist{display:flex;flex-direction:column;gap:16px}
.tier-h{display:flex;align-items:center;gap:10px;margin:0 2px 9px}
.tier-n{font-family:Fredoka,sans-serif;font-size:20px;font-weight:600;color:var(--court-d);letter-spacing:-.3px}
.tier-c{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--lime);color:var(--limeink);
  font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tier-h::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--line)}
.tier-body{display:flex;flex-direction:column;gap:9px;min-height:54px}
.tier-empty{border:2px dashed var(--line2);border-radius:var(--r-sm);padding:14px;text-align:center;
  color:var(--ink3);font-size:13px;font-weight:700}
.qn{display:inline-block;min-width:15px;color:var(--ink3);font-size:11.5px;
  font-weight:900;margin-right:1px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.qp{margin:0;width:100%;justify-content:flex-start;gap:5px;padding:9px 10px;
  min-width:0;overflow:hidden}
.qp>span:last-child{margin-left:auto;flex:0 0 auto}
.qdiv{display:flex;align-items:center;gap:9px;margin:13px 0 11px;
  font-size:10.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3)}
.qdiv::before,.qdiv::after{content:"";flex:1;height:2px;background:var(--line)}
/* Away reads off the row itself, in rose -- the counterpart to the mint used
   for who is here in the roster history, one step up in saturation so the two
   read as one system. No badge: the colour is the whole signal, which is why
   the row keeps its full-strength name instead of muting. The skill colour is
   left alone -- the stripe and the rank badge still say which group they are
   in, because that is what the host is scanning for when she brings them back.
   Only the Players list uses rose; the roster history stays white and mint. */
.isaway{background:var(--aw);border-top-color:var(--aw-b);
  border-right-color:var(--aw-b);border-bottom-color:var(--aw-b2)}
/* Roster history: who is in the hall tonight, read off the row itself rather
   than from a badge. The tier stripe down the left keeps its colour in both,
   because the level is the other thing the host is scanning for. */
.pitem.rhere{background:var(--hi);border-top-color:var(--hi-b);
  border-right-color:var(--hi-b);border-bottom-color:var(--hi-b2)}
.isaway .grip{color:#C98E96}
.awaybtn{flex:0 0 auto;touch-action:manipulation;font-size:11.5px;font-weight:800;
  border-radius:9px;padding:6px 10px;margin-right:4px;border:2px solid;
  min-width:64px;text-align:center}   /* Away and Back are the same size */
/* Named for what the button DOES: taking someone off is a red action,
   putting them back is a green one.
   The letters carry the weight. The fill is a faint tint and the border
   sits between the two -- softer than the text, but still enough colour that
   the grey of an away row cannot flatten the pill, which is what happened
   when the border was nearly white. A solid fill reads as a warning the host
   has to deal with, which is wrong for a control she taps all evening. */
.awaybtn.go-away{color:var(--red-d);background:var(--red-l);border-color:#EDA6A6}
.awaybtn.go-away:active{background:#FBD9D9}
.awaybtn.go-back{color:var(--court-d);background:#E2F2E7;border-color:#95CDA9}
.awaybtn.go-back:active{background:#CFE9D7}
.pitem{touch-action:pan-y;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none}   /* pan-y keeps the list scrollable; the grip blocks panning */
.pitem.lifted{position:fixed;z-index:300;pointer-events:none;margin:0;
  box-shadow:0 14px 30px rgba(15,36,25,.28);transform:scale(1.03);border-color:var(--court)}
.pitem.placeholder{background:rgba(14,138,79,.09);border:2px dashed var(--court);box-shadow:none}
.tierpick{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tierpick button{min-height:48px;border-radius:12px;background:var(--white);border:2px solid var(--line);
  border-bottom-width:4px;border-bottom-color:var(--line2);font-weight:800;font-size:14px}
.tierpick button.on{background:var(--court);color:#fff;border-color:var(--court-d);border-bottom-color:var(--court-x)}

/* ---------- courts ---------- */
.court{background:var(--card);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;
  margin-bottom:14px;box-shadow:var(--shadow)}
.court.locked{border-color:var(--court);box-shadow:0 0 0 3px rgba(14,138,79,.13),var(--shadow)}
.court-h{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;padding:11px 14px;color:#fff;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 46px),
             linear-gradient(135deg,var(--court-l),var(--court-d))}
.court-h .cn{font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
/* A full-width row of its own beneath the court number and the balance
   reading. Sharing their line left 'Upper Intermediate + Intermediate'
   wrapping to two lines, and the court title's nowrap would clip it. */
.ctier{flex:1 1 100%;order:3;font-family:Nunito,sans-serif;font-weight:800;font-size:11px;
  color:rgba(255,255,255,.8);letter-spacing:.3px;white-space:normal;margin-top:1px}
.court-b{padding:14px}
/* The result of the match just saved on a court. The next four are ALREADY
   drawn underneath -- this only covers them -- so the panel can name who is
   coming on, and a host who puts the phone down mid-flow leaves nothing
   undecided. Dismissing it uncovers the court card, nothing more. */
.court.saved{border-color:var(--court);border-width:3px;
  box-shadow:0 2px 0 var(--line2),0 10px 26px rgba(15,36,25,.16)}
.res-row{display:flex;align-items:center;gap:12px;border:2px solid var(--line);
  border-radius:var(--r-sm);padding:13px 14px;background:#F7FBF6}
.res-row.w{background:#E8F6ED;border-color:var(--court)}
.res-row+.res-row{margin-top:8px}
.res-nm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.res-nm b{font-weight:900;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-row.l .res-nm b{color:var(--ink2)}
.res-tag{font-size:10px;font-weight:900;letter-spacing:.09em;color:var(--court-d);margin-top:3px}
.res-sc{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;line-height:1;flex:none}
.res-row.w .res-sc{color:var(--court-d)}
.res-row.l .res-sc{color:var(--ink3)}
.court.held{border-style:dashed;border-color:var(--court)}
/* A court that has finished and is waiting on the host. At 25 players on 4
   courts the page is 3.5 screens and three of the four courts sit below the
   fold, so a court could stand empty 2000px down with nothing on the first
   screen to say so. This pins to the top and draws from here, so she never
   has to go and find it. */
.pendbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--court),var(--court-d));color:#fff;
  border-radius:var(--r-sm);padding:10px 12px;margin-bottom:13px;
  box-shadow:0 6px 18px rgba(15,36,25,.22);font-weight:800;font-size:14px}
.pendbar b{font-weight:900}
.pendbar .btn{margin-left:auto;flex:none;background:#fff;color:var(--court-d);
  border-color:#fff;border-bottom-color:rgba(0,0,0,.18)}
.team{border:2px solid var(--line);border-bottom-width:3px;border-radius:var(--r-sm);padding:10px;
  background:var(--white);display:block;width:100%;text-align:left}
.team.win{border-color:var(--court);background:#EAF7EF;box-shadow:0 0 0 3px rgba(14,138,79,.15)}
.team.lockedpair{border-color:var(--court);background:#F3FBF5}
.btn.xs.lockon{background:var(--court);color:#fff;border-color:var(--court-d);border-bottom-color:var(--court-x)}
.team.lose{opacity:.5}
.tnames{display:flex;flex-direction:column;gap:7px}
.chip{display:flex;align-items:center;gap:8px;background:var(--ground);border:2px solid transparent;
  border-radius:12px;padding:11px 12px;font-weight:800;font-size:15.5px;min-height:46px;width:100%;text-align:left}
.chip .st{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:800;font-variant-numeric:tabular-nums}
.chip.sel{border-color:var(--court);background:var(--lime);color:var(--limeink)}
.chip.over{border-color:var(--court)}

/* the net */
.vs{position:relative;height:26px;margin:9px 0;display:flex;align-items:center;justify-content:center}
.vs::before{content:"";position:absolute;inset:7px 0 0;border-radius:3px;
  background-image:repeating-linear-gradient(45deg,var(--line2) 0 1.5px,transparent 1.5px 8px),
                   repeating-linear-gradient(-45deg,var(--line2) 0 1.5px,transparent 1.5px 8px);
  border-top:4px solid var(--ink);border-radius:2px}
.vs span{position:relative;z-index:1;background:var(--white);border:2px solid var(--ink);
  font-family:Fredoka,sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;color:var(--ink);
  padding:3px 11px;border-radius:999px;margin-top:10px}

/* ---------- scoreboard ---------- */
.score{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 10px;margin-top:10px;
  background:linear-gradient(135deg,var(--court-d),var(--court-x));border-radius:var(--r-sm);
  font-family:Fredoka,sans-serif;font-size:40px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.25)}
.score .l{color:rgba(255,255,255,.5);font-size:30px}
.score .w{color:var(--lime)}
.scorepick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:11px}
.scorepick button{min-height:50px;border-radius:12px;background:var(--white);border:2px solid var(--line);
  border-bottom-width:4px;border-bottom-color:var(--line2);font-family:Fredoka,sans-serif;font-weight:600;font-size:17px}
.scorepick button:active{transform:translateY(2px);border-bottom-width:2px}
.scorepick button.on{background:var(--court);color:#fff;border-color:var(--court-d);border-bottom-color:var(--court-x)}
/* Hard right, on one line, and never squeezed: the court's group label gets
   whatever is left, which is what keeps it off a second line. */
.bal{display:flex;align-items:center;font-size:11.5px;font-weight:900;margin-left:auto;
  color:#fff;white-space:nowrap;flex:none}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);text-align:right;
  padding:9px 6px;border-bottom:2px solid var(--line);font-weight:900}
th:nth-child(2){text-align:left}
td{padding:12px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
td:nth-child(2){text-align:left;font-weight:800}
tr:last-child td{border-bottom:none}
.rk{width:34px;text-align:center!important;font-family:Fredoka,sans-serif;font-weight:600;color:var(--ink3)}
tr.top1{background:linear-gradient(90deg,#FFF8E0,transparent)}
tr.top2{background:linear-gradient(90deg,#F4F6F8,transparent)}
tr.top3{background:linear-gradient(90deg,#FBF0E4,transparent)}
tr.rest td:nth-child(2)::after{content:"RESTING";font-size:9px;font-weight:900;color:#7A5A00;
  background:#FFF0C9;padding:3px 6px;border-radius:999px;margin-left:7px;letter-spacing:.5px}
.few{color:var(--court)!important}
.card.board{padding:4px 8px}
.board table{font-size:13px}
.board th{padding:9px 3px;font-size:9.5px;letter-spacing:.3px}
.board td{padding:11px 3px}
.board td:nth-child(2){font-size:14px}
.board .rk{width:26px}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.hl>div{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-bottom-color:var(--line2);
  border-radius:var(--r-sm);padding:13px 12px;box-shadow:var(--shadow)}
.hl>div.low{border-bottom-color:#EFC9C9}
.hl .lab{font-size:10px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.hl .nm{font-family:Fredoka,sans-serif;font-size:19px;font-weight:600;margin-top:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .val{font-size:13px;font-weight:800;color:var(--court);margin-top:2px}
.hl>div.low .val{color:var(--red)}

/* ---------- history / matrix / stats ---------- */
.hist{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;
  margin-bottom:12px;box-shadow:var(--shadow)}
.hrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700}
.hrow:last-of-type{border-bottom:none}
.hrow .w{font-weight:900}
.hrow .sc{margin-left:auto;font-family:Fredoka,sans-serif;font-weight:600;font-variant-numeric:tabular-nums;font-size:17px}
.matrix{overflow:auto;-webkit-overflow-scrolling:touch}
.matrix table{font-size:11.5px;min-width:min-content}
.matrix td,.matrix th{padding:6px;text-align:center;white-space:nowrap;border-bottom:none}
.matrix th:nth-child(2),.matrix td:nth-child(1){text-align:left}
.matrix td.c1{background:#FFF0C9;color:#7A5A00;font-weight:900;border-radius:7px}
.matrix td.c2{background:var(--red-l);color:var(--red-d);font-weight:900;border-radius:7px}
.stat{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.stat .k{font-size:13px;color:var(--ink2);font-weight:700;flex:1}
.stat .v{font-weight:900;text-align:right;font-size:15px}
.stat .v small{display:block;color:var(--ink3);font-weight:700;font-size:11.5px}
.sl{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.sl:last-child{border-bottom:none}
.sl .lab{flex:1;font-size:14.5px;font-weight:800}
.sl .lab small{display:block;color:var(--ink3);font-weight:600;font-size:11.5px;margin-top:3px}
.sl input[type=range]{width:110px;accent-color:var(--court);padding:0;background:none;border:none}
.sl input[type=number]{width:94px;padding:10px;text-align:center}
.sl select{width:136px;padding:10px 6px;text-align:center}
.seg{display:flex;background:var(--ground);border:2px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:12.5px;font-weight:800;color:var(--ink2)}
.seg button.on{background:var(--court);color:#fff}
.presets{display:flex;gap:8px;align-items:center}
.presets button{flex:1;min-height:46px;border-radius:12px;background:var(--white);border:2px solid var(--line);
  border-bottom-width:4px;border-bottom-color:var(--line2);font-family:Fredoka,sans-serif;font-weight:600;font-size:16px}
.presets button.on{background:var(--court);color:#fff;border-color:var(--court-d);border-bottom-color:var(--court-x)}
.scorepick.wide{grid-template-columns:repeat(6,1fr)}
.scorepick.wide button{min-height:46px;font-size:15px}

/* ---------- final results ---------- */
.champ{background:linear-gradient(135deg,var(--court-l),var(--court-d));color:#fff;border-radius:var(--r);
  padding:22px 18px;text-align:center;margin-bottom:13px;box-shadow:0 6px 20px rgba(10,107,61,.3);
  position:relative;overflow:hidden}
.champ::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 2px,transparent 2px 54px)}
.champ .lbl{position:relative;z-index:1;font-size:11.5px;font-weight:900;letter-spacing:1.4px;
  text-transform:uppercase;color:rgba(255,255,255,.85)}
.champ .nm{position:relative;z-index:1;font-family:Fredoka,sans-serif;font-size:34px;font-weight:600;margin:6px 0 2px}
.champ .pts{position:relative;z-index:1;font-size:14px;font-weight:800;color:var(--lime)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:13px}
.podium>div{background:var(--white);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r-sm);
  padding:13px 6px;text-align:center}
.podium .m{font-size:22px;line-height:1}
.podium .n{font-weight:900;font-size:13.5px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .p{font-family:Fredoka,sans-serif;font-weight:600;color:var(--court);font-size:16px}

.modal{position:fixed;inset:0;z-index:100;background:rgba(15,36,25,.55);display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);border:2px solid var(--line);border-radius:24px 24px 0 0;padding:20px;
  width:100%;max-width:520px;max-height:88vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@media(min-width:560px){.modal{align-items:center}.modal>div{border-radius:24px}}
.empty{text-align:center;color:var(--ink3);padding:40px 16px;font-size:14px;font-weight:700}
.empty b{display:block;color:var(--ink);font-family:Fredoka,sans-serif;font-size:18px;font-weight:600;margin-bottom:7px}
.empty .ic{font-size:40px;display:block;margin-bottom:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ══ access gate ═══════════════════════════════════════════════════════════
   Covers the app until a valid session AND a live entitlement are confirmed.
   Present in the HTML from the first byte, so the app is never briefly usable
   while JavaScript is still starting up. */
/* NOT position:fixed, deliberately. An installed iOS app with
   apple-mobile-web-app-status-bar-style=black-translucent and
   viewport-fit=cover mis-maps hit testing on a full-screen fixed element:
   it paints in the right place but every tap lands a status-bar height
   above the target, so the screen looks perfect and nothing responds.
   Flex centering inside an overflow:auto box has the same failure mode.
   In normal document flow neither can happen. */
#gate{min-height:100vh;min-height:100dvh;background:var(--ground);
  display:flex;align-items:center;justify-content:center;
  padding:24px max(18px,env(safe-area-inset-left,0px));
  padding-top:max(24px,env(safe-area-inset-top,0px));
  padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
#gate[hidden]{display:none!important}
/* While the gate is up the app is not merely covered -- it is gone, so
   nothing of it can intercept a tap. */
html.gated header,html.gated main,html.gated nav,html.gated #modalRoot{display:none!important}
html.gated body{padding-bottom:0}
.gcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:26px 22px;width:100%;max-width:380px;margin:auto}
.gshut{width:64px;height:64px;border-radius:17.2%;display:block;margin:0 auto 14px}
.gtitle{font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-weight:600;
  font-size:23px;color:var(--ink);text-align:center;margin:0}
.gsub{color:var(--ink2);font-size:14px;text-align:center;margin:5px 0 20px;line-height:1.5}
.gfield{margin-bottom:13px}
.gfield label{display:block;font-size:12px;font-weight:800;color:var(--ink3);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.gfield input{width:100%;font:inherit;font-size:16px;padding:13px 14px;
  border:2px solid var(--line);border-radius:var(--r-sm);background:var(--white);
  color:var(--ink);min-height:var(--tap)}
.gfield input:focus{outline:none;border-color:var(--court)}
.gpwwrap{position:relative}
.gpwwrap input{padding-right:74px}
#gEye{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:var(--ground);border:none;color:var(--ink2);font:inherit;font-size:12px;
  font-weight:800;letter-spacing:.05em;padding:9px 11px;border-radius:9px;cursor:pointer}
#gEye:active{background:var(--line)}
#gBtn{width:100%;font:inherit;font-size:16px;font-weight:800;color:#fff;
  background:var(--court);border:none;border-radius:var(--r-sm);
  min-height:var(--tap);margin-top:7px;cursor:pointer;
  box-shadow:0 3px 0 var(--court-d)}
#gBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--court-d)}
#gBtn:disabled{opacity:.6}
.gerr{background:var(--red-l);color:var(--red-d);border-radius:var(--r-sm);
  padding:11px 13px;font-size:13.5px;font-weight:700;margin-bottom:14px;line-height:1.45}

<div id="modalRoot"></div>
<script>
"use strict";
/* =========================================================================
   BADMINTON ROTATION & POINTS — engine + UI (offline, localStorage)
   ========================================================================= */
const LS='badminton_rotation_v1';
const BUILD='v65';   // bump together with V in sw.js
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* A counter as well as randomness. Players are keyed by this id, so two
   players sharing one silently merges them on every lookup -- rare, but it
   costs nothing to make impossible. */
let _uidN=0;
const uid=()=>'p'+(Date.now().toString(36))+(_uidN++).toString(36)+Math.random().toString(36).slice(2,6);

/* ---------------- state ---------------- */
function defState(){return{
  v:1, started:false, ended:false, queueOpen:false,
  players:[],                 // {id,name,tier,away,qg,lastPlayed} — array order IS the
                              // skill ranking, and the only thing that sets level
  /* The ROSTER is every name this host has ever entered, in one order, each
     with a level. It is the player history: it outlives a session, a night,
     and a new-session reset. Array order IS the ranking.
     S.players is tonight's LINEUP -- a subset, always shown in roster order. */
  roster:[],
  courts:[],                  // one independent match per court (or null)
  matches:[],                 // finished matches, oldest first
  recentQuads:{},             // foursome -> match index it last played, for variety
  settings:{
    courts:2, mode:'firstto', total:21,
    scoring:'wins',
    partnerStrict:4, oppStrict:3, balance:3,
    pairing:'level', rankBy:'points', allowOverride:false, noise:3
  }
};}
let S=defState(), tab='game', sel=null, dragId=null;
/* Courts currently showing the result of the match just saved on them:
   court index -> that match's index in S.matches. Deliberately NOT part of S:
   it is a transient reading of what just happened, and a reload should land
   the host on the live courts rather than on a stale result. */
/* Courts standing deliberately empty, index -> {idx, played, held}.
     idx    = the match in S.matches whose result the panel is showing
     played = the four who came off, so the no-instant-replay rule still
              applies whenever the host finally draws
     held   = the host chose to wait for another court; the panel collapses
              to a compact card and the court is drawn together with whichever
              court she acts on next.
   A court with an entry here is NOT refilled by fillCourts(): it is waiting on
   a decision. Deliberately NOT part of S -- a transient reading of what just
   happened, and a reload should land the host on live courts, not on a stale
   result. load() therefore draws anything left empty. */
let savedPanel={};

function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function load(){
  try{const r=localStorage.getItem(LS);
    const o=r?JSON.parse(r):null; if(o&&o.v===1){S=Object.assign(defState(),o);
      S.settings=Object.assign(defState().settings,o.settings||{});
      if(o.settings){                       // pre-existing session: don't change its rules
        if(o.settings.mode===undefined)S.settings.mode='combined';
        if(o.settings.pairing===undefined)S.settings.pairing='social';
      }
      S.courts=Array.isArray(o.courts)?o.courts:[];
      S.recentQuads=(o.recentQuads&&typeof o.recentQuads==='object')?o.recentQuads:{};
      S.matches=Array.isArray(o.matches)?o.matches:[];
      // fields added with Away; absent on anything saved earlier
      S.players.forEach(p=>{
        if(p.away===undefined)p.away=false;
        if(p.qg===undefined)p.qg=0;
        if(p.lastPlayed===undefined)p.lastPlayed=0;
      });
      S.players.forEach(p=>{if(p.tier==='new')p.tier='beg';
        if(!TIERS.some(x=>x[0]===p.tier))p.tier='int'});
      // sessions saved before scoring modes existed only stored the winner's score
      const T=S.settings.total;
      const fixScore=c=>{ if(c.loseScore==null&&c.winScore!=null)c.loseScore=T-c.winScore };
      S.matches.forEach(fixScore);
      /* Synchronised mode is gone. A session saved under it kept its results
         in o.rounds, which nothing reads any more, so its leaderboard and its
         history would come back empty. A finished round is just a handful of
         matches that happened at the same time, so flatten them into
         S.matches in the order they were played and the standings survive
         intact. Rounds carry no clock, so those rows show no time, and the
         resting list is dropped -- nothing reads it now rounds are not drawn. */
      const syncRounds = Array.isArray(o.rounds) ? o.rounds.slice() : [];
      /* A round she had confirmed but not yet finished holds real results on
         any court she had already scored -- tapping Finish Round was all that
         stood between them and the leaderboard. Carry those across rather
         than throw away games people actually played. A court with no winner
         yet was still in play and has nothing to record. */
      if(o.current && o.current.confirmed && Array.isArray(o.current.courts)){
        const done=o.current.courts.filter(c=>c&&c.winner);
        if(done.length) syncRounds.push({n:o.current.n, resting:[], courts:done});
      }
      if(syncRounds.length){
        const moved=[];
        syncRounds.forEach(r=>(r.courts||[]).forEach((c,ci)=>{
          if(!c||!Array.isArray(c.a)||!Array.isArray(c.b))return;
          fixScore(c);
          moved.push({at:null, court:ci+1, a:[...c.a], b:[...c.b],
                      winner:c.winner, winScore:c.winScore, loseScore:c.loseScore});
        }));
        S.matches=moved.concat(S.matches);
        /* The queue clock has to agree with the history it was just handed or
           everyone looks like they have played nothing, and the first draws of
           the evening are nonsense. */
        const seen={};
        S.matches.forEach(m=>[...m.a,...m.b].forEach(id=>{seen[id]=(seen[id]||0)+1}));
        S.players.forEach(p=>{ p.qg=seen[p.id]||0; p.lastPlayed=0 });
        S.matches.forEach((m,i)=>[...m.a,...m.b].forEach(id=>{
          const p=P(id); if(p)p.lastPlayed=i+1; }));
      }}
  }catch(e){}
  if(!S.started)tab='players';          // nothing set up yet: start on the roster
  // savedPanel is transient, so a court the host was holding has nothing left
  // to explain it after a reload. Draw it rather than leave her looking at an
  // empty court with no way to fill it.
  if(S.started)fillCourts();
}
const P=id=>S.players.find(p=>p.id===id);
const nameOf=id=>{const p=P(id);return p?p.name:'?'};
const teamName=t=>t.map(nameOf).join(' + ');
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
/* skill tiers — Advanced is strongest. The players array stays the single skill
   order; tier just groups it, and sorting by tier keeps the two in step. */
/* 'new' is a holding pen, not a skill. Anyone the app has never seen lands
   there and stays until the host drags them to a real level; the group hides
   itself the moment it is empty, so most nights it does not exist at all. */
const TIERS=[['new','New players'],['adv','Advanced'],['upp','Upper Intermediate'],['int','Intermediate'],['beg','Beginner']];
const REAL_TIERS = TIERS.filter(t => t[0] !== 'new');
/* Abbreviations, used on a court card only when three or four groups share
   one court -- the full names would wrap to a second line there. */
const TIER_SHORT={new:'New',adv:'Adv',upp:'Upper',int:'Int',beg:'Beg'};
const TIER_I=t=>{const i=TIERS.findIndex(x=>x[0]===t);return i<0?TIERS.findIndex(x=>x[0]==='int'):i};
const tierOf=p=>p&&TIERS.some(x=>x[0]===p.tier)?p.tier:'int';
function sortByTier(){            // stable: order inside a tier is preserved
  S.players=S.players.map((p,i)=>({p,i}))
    .sort((a,b)=>TIER_I(tierOf(a.p))-TIER_I(tierOf(b.p))||a.i-b.i)
    .map(x=>x.p);
}

/* ---------------- the roster: who has ever played ------------------------
   One entry per person, ever. The array's order is their ranking, and it is
   the thing that must survive a night, a reset and a month off. Tonight's
   lineup is a subset of it, shown in the same order -- so a host who decides
   Jon has got better and drags him above Ryan finds him there next week, and
   the week after, whoever else happens to turn up. */
const rkey = n => String(n||'').trim().toLowerCase();
const rosterGet = n => (S.roster||[]).find(r => rkey(r.name) === rkey(n));
function sortRoster(){            // same stable tier grouping as the lineup
  S.roster = (S.roster||[]).map((r,i)=>({r,i}))
    .sort((a,b)=>TIER_I(a.r.tier||'int')-TIER_I(b.r.tier||'int')||a.i-b.i)
    .map(x=>x.r);
}
/* New names go in at the TOP, as one block in the order they were given, so
   the host has them together to place rather than scattered down the list. */
function rosterAdd(name, tier){
  if(rosterGet(name)) return rosterGet(name);
  const e = {name:String(name).trim(), tier:tier||'int'};
  S.roster = [e].concat(S.roster||[]);
  return e;
}
/* Push tonight's order and levels back into the roster.
   Lineup members keep the SLOTS they already occupy in the roster and are
   refilled in their new order; everyone absent is never touched, so their
   place relative to each other survives untouched. */
function rosterSync(){
  S.roster = S.roster || [];
  S.players.forEach(p => { const r = rosterAdd(p.name, p.tier); r.tier = p.tier; });
  const here = new Set(S.players.map(p => rkey(p.name)));
  const queue = S.players.slice();
  let qi = 0;
  S.roster = S.roster.map(r => here.has(rkey(r.name)) ? (queue[qi++] || r) : r)
                     .map(r => ({name:r.name, tier:r.tier}));
  sortRoster();
}
/* scoring modes -------------------------------------------------------------
   combined : both scores add up to settings.total — you enter the WINNER's score
   firstto  : winner reaches settings.total        — you enter the LOSER's score   */
const isFirstTo=()=>S.settings.mode==='firstto';
const modeName=()=>isFirstTo()?`First to ${S.settings.total}`:`Combined ${S.settings.total}`;
const lossOf=c=>c.loseScore!=null?c.loseScore:(c.winScore==null?null:S.settings.total-c.winScore);
const hasScore=c=>c.winScore!=null&&lossOf(c)!=null;
function applyScore(c,v){            // v is whichever number that mode asks for
  if(isFirstTo()){c.winScore=S.settings.total;c.loseScore=v}
  else{c.winScore=v;c.loseScore=S.settings.total-v}
}
function scoreRange(){               // [min,max] of the number the user picks
  return isFirstTo()?[0,S.settings.total-1]
                    :[Math.floor(S.settings.total/2)+1,S.settings.total-1];
}
const pickedValue=c=>isFirstTo()?lossOf(c):c.winScore;
/* ---------------- derived stats (single source of truth = S.matches) ----- */
/* Who is actually here. Declared high up because stats() depends on it. */
// Wins only: the host taps who won and nothing else. No scores anywhere.
const winsOnly  = () => S.settings.scoring === 'wins';
const present   = () => S.players.filter(p => !p.away);

function stats(){
  const m={};
  S.players.forEach(p=>m[p.id]={id:p.id,pts:0,games:0,wins:0,losses:0,rests:0,lastRest:null,
    partners:{},lastPartner:{},opps:{},lastOpp:{},scores:[],lastPlayed:null});
  const apply=(rd,full)=>{
    (rd.resting||[]).forEach(id=>{if(m[id]){m[id].rests++;m[id].lastRest=rd.n}});
    (rd.courts||[]).forEach(c=>{
      [[c.a,c.b],[c.b,c.a]].forEach(([t,o])=>{
        if(t[0]&&t[1]){
          const x=t[0],y=t[1];
          if(m[x]&&m[y]){
            m[x].partners[y]=(m[x].partners[y]||0)+1; m[x].lastPartner[y]=rd.n;
            m[y].partners[x]=(m[y].partners[x]||0)+1; m[y].lastPartner[x]=rd.n;
          }
        }
        t.forEach(x=>o.forEach(y=>{if(m[x]&&m[y]){m[x].opps[y]=(m[x].opps[y]||0)+1;m[x].lastOpp[y]=rd.n}}));
      });
      if(!full)return;
      // A winner alone is enough. Gating this on a score meant Wins only
      // counted nothing at all -- no games, no wins, an empty leaderboard.
      if(c.winner){
        const scored=hasScore(c);
        const ws=scored?c.winScore:0, ls=scored?lossOf(c):0;
        const w=c.winner==='a'?c.a:c.b, l=c.winner==='a'?c.b:c.a;
        w.forEach(id=>{const s=m[id];if(!s)return;s.pts+=ws;s.games++;s.wins++;if(scored)s.scores.push(ws);s.lastPlayed=rd.n});
        l.forEach(id=>{const s=m[id];if(!s)return;s.pts+=ls;s.games++;s.losses++;if(scored)s.scores.push(ls);s.lastPlayed=rd.n});
      }
    });
  };
  // A finished match is a round with one court and nobody resting, so the
  // same apply() handles both shapes. Match index doubles as the recency
  // clock that lastPartner/lastOpp compare against.
  (S.matches||[]).forEach((mt,i)=>apply({n:i+1,resting:[],courts:[mt]},true));
  // matches in progress already count for partner/opponent variety
  const n=(S.matches||[]).length+1;
  (S.courts||[]).forEach(c=>{if(c)apply({n,resting:[],courts:[c]},false)});
  Object.values(m).forEach(s=>{s.avg=s.games?s.pts/s.games:0;s.wr=s.games?s.wins/s.games:0});
  return m;
}
const matchesDone=()=> (S.matches||[]).length;

/* ------------- skill score, from placement alone (5-95) ------------------ */
function strengths(st){
  // Level comes from WHERE A PLAYER SITS IN THE SKILL ORDER, and nothing
  // else. Points are a scoreboard between friends, not a rating: a beginner
  // who has a good night is still a beginner, and should not start being
  // fed to the Advanced court because the numbers flattered them.
  //
  // This used to blend placement with points per game, and the blend DECAYED
  // -- placement was 70% early and only 20% late in a session -- so by the
  // end of a night the matchmaker was ranking people almost entirely on
  // score. The host owns the order; drag someone to change their level.
  const n = S.players.length, out = {};
  S.players.forEach((p, i) => {
    out[p.id] = n < 2 ? 50 : 95 - 90 * i / (n - 1);   // first => 95, last => 5
  });
  return out;
}

/* Courts we can actually fill. Counts who is PRESENT, not everyone on the
   roster: with away players counted, Away appeared to do nothing -- the court
   stayed open for someone who had gone home.
   Courts in Settings is a MAXIMUM; we only use as many as the players here
   can fill four to a court. */
function activeCourts(){
  return clamp(Math.min(S.settings.courts,Math.floor(present().length/4)),0,20);
}

/* The court header takes the colour of the levels playing on it. A green bar
   told the host nothing: every player dot on the card is already tier-coloured,
   so the header was the one part of the card that disagreed with the rest.

   These are not the dot colours exactly. White text needs 3:1 to be legible
   and the real Intermediate and Beginner come in at 2.2 and 2.0, so both are
   deepened; Advanced goes the other way and brightens. Intermediate also
   moves off cyan to teal, because at 16 degrees from Upper Intermediate's
   blue the two solid headers were impossible to tell apart down a list. */
const HDR = {new:'#C8880A', adv:'#7B5CFF', upp:'#2E90F5', int:'#0DA39B', beg:'#C8880A'};
const hdrShade = (hex, pct) => {
  const n = parseInt(hex.slice(1),16);
  const f = v => Math.max(0, Math.min(255, Math.round(v*(100+pct)/100)));
  return '#'+[f(n>>16), f((n>>8)&255), f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
};
/* One colour or two, never more.
     4+0 or 3+1 -> the majority's colour alone
     2+2        -> both, stronger first
     2+1+1      -> the span: the highest level on court and the lowest  */
function courtColours(c){
  const t = [...c.a, ...c.b].map(id => tierOf(P(id)));
  const n = {}; t.forEach(x => n[x] = (n[x]||0)+1);
  const present = TIERS.map(x=>x[0]).filter(k => n[k]);
  if(present.length === 1) return [present[0]];
  const top = present.slice().sort((a,b) => n[b]-n[a])[0];
  if(n[top] >= 3) return [top];
  if(present.length === 2) return present;
  return [present[0], present[present.length-1]];
}
function courtHeadStyle(c){
  if(!c || S.settings.pairing !== 'level') return '';
  const ks = courtColours(c), a = HDR[ks[0]], b = HDR[ks[ks.length-1]];
  const stripes = 'repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 46px)';
  const fill = ks.length === 1
    ? `linear-gradient(135deg,${a},${hdrShade(a,-20)})`
    : `linear-gradient(100deg,${a} 0%,${a} 34%,${b} 66%,${b} 100%)`;
  return ` style="background:${stripes},${fill}"`;
}

function courtTiers(c){            // which skill groups are on this court, in order
  const seen=[];
  TIERS.forEach(([k,name])=>{ if([...c.a,...c.b].some(id=>tierOf(P(id))===k))seen.push([k,name]) });
  // One or two groups is the normal case and the full names fit on the line.
  // Three or four only happens when a group cannot fill a court on its own,
  // and there the names have to be abbreviated to stay on one line.
  const brief = seen.length >= 3;
  return seen.map(([k,name]) => brief ? TIER_SHORT[k] : name).join(' + ');
}
function balanceOf(c,str){
  const d=Math.abs((str[c.a[0]]+str[c.a[1]])-(str[c.b[0]]+str[c.b[1]]));
  return clamp(Math.round(100-d*2),0,100);
}

/* =========================== UI ========================================== */
const ICONS={
  game:'<path d="M4 12a8 8 0 0116 0"/><path d="M4 12h16"/><circle cx="12" cy="18" r="2.5"/>',
  board:'<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/>',
  players:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0112 0"/><path d="M16 5.5a3 3 0 010 5.5"/><path d="M18.5 20a5.5 5.5 0 00-2.5-4.6"/>',
  history:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/>',
  set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.6 19.5l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 15a2 2 0 010-4 1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 009 4.6V4a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1A1.6 1.6 0 0021 11a2 2 0 010 4z"/>'
};
const TABS=[['game','Game','game'],['board','Leaderboard','board'],['players','Players','players'],
            ['history','History','history'],['settings','Settings','set']];

/* `act` is an optional {label, fn} -- a single button inside the toast. It is
   what makes a one-tap action safe to undo without a confirmation screen in
   the way, so a toast carrying one stays up long enough to be read and
   tapped. Toasts stack upwards rather than landing on top of each other,
   because saving a result can raise two at once. */
function toast(msg,bad,act){
  const n=document.querySelectorAll('.toastmsg').length;
  const d=document.createElement('div');
  d.className='toastmsg';
  d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:'+(96+n*58)+'px;z-index:200;max-width:88%;'+
    'display:flex;align-items:center;gap:12px;'+
    'background:'+(bad?'#4a1f22':'#173a25')+';color:'+(bad?'#ffb4b4':'#b9f5d2')+';border:1px solid '+(bad?'#7a3238':'#2b6a45')+
    ';padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5)';
  const t=document.createElement('span'); t.textContent=msg; d.appendChild(t);
  if(act){
    const b=document.createElement('button');
    b.textContent=act.label;
    b.style.cssText='flex:none;font:inherit;font-weight:800;color:#b9f5d2;background:rgba(255,255,255,.1);'+
      'border:1px solid #2b6a45;border-radius:9px;padding:6px 12px;cursor:pointer';
    b.onclick=()=>{ d.remove(); act.fn(); };
    d.appendChild(b);
  }
  document.body.appendChild(d);
  setTimeout(()=>{d.style.transition='opacity .3s';d.style.opacity='0';setTimeout(()=>d.remove(),320)},act?5600:1900);
}
function modal(html){
  $('#modalRoot').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div>'+html+'</div></div>';
}
function closeModal(){$('#modalRoot').innerHTML='';_ask=null}
let _ask=null;
function ask(msg,yes,cb){
  _ask=cb;
  modal(`<h3 style="margin-bottom:10px">${esc(yes)}?</h3><div class="muted" style="margin-bottom:18px">${esc(msg)}</div>
    <button class="btn dan full" onclick="askYes()">${esc(yes)}</button>
    <button class="btn gho full" style="margin-top:10px" onclick="closeModal()">Cancel</button>`);
}
function askYes(){const f=_ask;_ask=null;closeModal();if(f)f()}
function askText(title,val,cb){
  _ask=cb;
  modal(`<h3 style="margin-bottom:12px">${esc(title)}</h3>
    <input id="askInput" value="${esc(val)}" autocomplete="off">
    <button class="btn pri full" style="margin-top:16px" onclick="askTextYes()">Save</button>
    <button class="btn gho full" style="margin-top:10px" onclick="closeModal()">Cancel</button>`);
  const i=$('#askInput');if(i){i.focus();i.select();i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();askTextYes()}}}
}
function askTextYes(){const f=_ask,v=($('#askInput')||{}).value;_ask=null;closeModal();if(f)f(v)}

function render(){
  const nav=$('#nav');
  nav.innerHTML=TABS.map(([k,l,i])=>
    `<button class="${tab===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICONS[i]}</svg>${l}</button>`).join('');
  const st=stats();
  const app=$('#app');
  app.innerHTML = tab==='game' ? viewGame(st)
    : tab==='board' ? viewBoard(st)
    : tab==='players' ? viewPlayers(st)
    : tab==='history' ? viewHistory(st)
    : viewSettings();
  // after the body renders, so a court drawn during render shows in the title
  $('#hTitle').textContent = tab!=='game' ? TABS.find(t=>t[0]===tab)[1]
      : !S.started ? 'New Session'
      : S.ended ? 'Final Score'
      : 'Session';
  /* Courts finish independently, so there are no rounds to count: dividing
     matches by courts read as "0 rounds played" after two real games, which
     looks like nothing has happened. Count the matches. */
  const done = `${(S.matches||[]).length} match${(S.matches||[]).length===1?'':'es'}`;
  $('#hSub').textContent =
      `${present().length} player${present().length===1?'':'s'} · ${activeCourts()||'no'} court${activeCourts()===1?'':'s'} · ${done}`;
  /* The build, on every screen. Hosts send screenshots when something looks
     wrong, and the first thing worth knowing is whether they are on the
     version the fix went into. */
  $('#hRight').innerHTML = `<span class="tag ver">${BUILD}</span>`;
  wire();
  save();
}
function go(t){tab=t;sel=null;window.scrollTo(0,0);render()}

/* ---------------- start panel (Game tab, before a session) --------------- */
function viewStart(){
  // present(), not the whole roster: with people marked away the panel used to
  // promise courts and resting numbers that activeCourts() would not deliver.
  const n=present().length, away=S.players.length-n,
        c=S.settings.courts, ac=activeCourts(), playing=ac*4;
  if(!S.players.length)return `<div class="card"><div class="empty"><span class="ic">\u{1F3F8}</span>
      <b>Add your players first</b>Put everyone in, then sort them into skill groups.</div></div>
    <button class="btn pri full" onclick="go('players')">Go to Players</button>`;
  return `
  <div class="card">
    <div class="row" style="justify-content:space-around;text-align:center">
      <div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:24px">${playing}</div><div class="mini">Playing</div></div>
      <div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:24px;color:${n-playing>0?'#C8820A':'var(--ink3)'}">${Math.max(0,n-playing)}</div><div class="mini">Resting</div></div>
      <div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:24px">${ac}</div><div class="mini">Courts in use</div></div>
    </div>
  </div>
  ${away ? `<div class="note">${away} marked away \u2014 ${n} here, and only they are picked.</div>` : ''}
  ${n<4 ? `<div class="note">A doubles court needs 4 players \u2014 ${4-n} more and you can play.</div>`
   : ac<c ? `<div class="note">${n} players fills <b>${ac} court${ac>1?'s':''}</b>${n-playing?` with ${n-playing} waiting`:''}.
             Courts is a maximum \u2014 the app only uses what you can fill.</div>` : ''}
  <div class="card tight">
    <div class="row"><span class="mini">Scoring</span><span class="sp"></span>
      <span style="font-weight:800;font-size:14px">${modeName()}</span></div>
    <div class="row" style="margin-top:8px"><span class="mini">Match style</span><span class="sp"></span>
      <span style="font-weight:800;font-size:14px">${S.settings.pairing==='level'?'Same level':'Social mix'}</span></div>
  </div>
  <button class="btn pri full" style="margin-top:4px" onclick="startSession()">Start Session</button>
  <div class="grid2" style="margin-top:11px">
    <button class="btn" onclick="go('players')">Edit players</button>
    <button class="btn" onclick="go('settings')">Settings</button>
  </div>`;
}

/* ---------------- game --------------------------------------------------- */
function viewGame(st){
  if(!S.started)return viewStart();
  if(S.ended)return viewFinal(st);
  if(activeCourts()<1){
    const n=S.players.length;
    return `<div class="card"><div class="empty"><span class="ic">🏸</span><b>${n?'Waiting for players':'No players yet'}</b>
      A doubles court needs 4. You have ${n} — ${Math.max(0,4-n)} more to start.</div></div>
      <button class="btn pri full" onclick="go('players')">Add players</button>`;
  }
  /* Sweep every court inside the limit, not only the all-empty case.
     Several paths leave one court empty with nothing to refill it -- coming
     back from the final screen, raising the court count, changing a setting --
     and v52's blanket refill on save, which used to paper over all of them,
     went when the result panel arrived. fillCourts() skips a court waiting on
     a Next-teams decision, so the pause is untouched; this only picks up
     courts nothing else was going to fill. */
  fillCourts();
  return viewRolling(st);
}

/* ---- Rolling: the Game tab ------------------------------------------ */
const courtAt = i => (S.courts||[])[i];

/* Swap a player on a court with someone in the queue, or two players
   across courts. Same two-tap gesture as Synchronised mode. */
function tapRolling(id){
  if(sel === id){ sel = null; render(); return; }
  if(!sel){ sel = id; render(); return; }
  const find = x => {
    for(let i=0;i<(S.courts||[]).length;i++){
      const c = S.courts[i]; if(!c) continue;
      let k = c.a.indexOf(x); if(k>=0) return {c, side:'a', k};
      k = c.b.indexOf(x);     if(k>=0) return {c, side:'b', k};
    }
    return null;
  };
  const A = find(sel), B = find(id);
  if(A && B){ A.c[A.side][A.k] = id; B.c[B.side][B.k] = sel; }
  else if(A && !B){ A.c[A.side][A.k] = id; }       // queued player comes on
  else if(!A && B){ B.c[B.side][B.k] = sel; }
  sel = null; render();
}

/* A pill in the "see all waiting" sheet. Closing first means the swap lands
   on a visible court rather than behind the sheet; with nobody picked yet
   this just selects them, and the note above the courts says what to do. */
function tapQueued(id){
  closeModal();
  tapRolling(id);
}

/* The whole queue, in the same two-per-row pills as the card so twenty-two
   people take eleven rows rather than twenty-two.

   These pills used to be plain <span>s -- view only, with swapping left to
   the four shown on the card. A host reported that she could swap somebody
   on court with any of the top four but with nobody further down, which is
   exactly what that meant: the sheet listed twenty people and only ever let
   her pick from four. Every pill is now a button into the same two-tap
   gesture the card uses. */
function queueDialog(){
  const st = stats(), queue = queueOrder(), away = S.players.filter(p => p.away);
  const pill = (id, n) => {
    const s = st[id] || {games:0};
    return `<button class="pill qp ${sel===id?'sel':''}" data-pid="${id}"
      style="${sel===id?'border-color:var(--court);background:rgba(14,138,79,.12)':''}"
      onclick="tapQueued('${id}')"><i class="tdot" data-tier="${tierOf(P(id))}"></i>
      <b class="qn">${n}</b>${esc(nameOf(id))}
      <span style="color:var(--ink3);font-size:11.5px;font-weight:800">${s.games||0} ${(s.games||0)===1?'game':'games'}</span></button>`;
  };
  const next = queue.slice(0, 4).map((id,i) => pill(id, i+1)).join('');
  const rest = queue.slice(4).map((id,i) => pill(id, i+5)).join('');
  modal(`<h3 style="margin-bottom:4px">Waiting</h3>
    <div class="muted" style="margin-bottom:14px">${queue.length} in the queue, in order.${
      sel ? ` Tap one to swap <b>${esc(nameOf(sel))}</b> with them.`
          : ' Tap anyone to swap them onto a court.'}</div>
    <div class="qgrid">${next}</div>
    ${rest ? `<div class="qdiv"><span>next court</span></div><div class="qgrid">${rest}</div>` : ''}
    ${away.length ? `<div class="muted" style="margin-top:14px;opacity:.7">
        ${away.length} away: ${away.map(p=>esc(p.name)).join(', ')}</div>` : ''}
    <button class="btn pri full" style="margin-top:18px" onclick="closeModal()">Close</button>`);
}

function reshuffleCourt(i){
  const c = S.courts[i]; if(!c) return;
  if(c.winner || hasScore(c)){ toast('Clear the result first', 1); return; }
  S.courts[i] = null;
  fillCourts();
  render(); toast('Court ' + (i+1) + ' redrawn');
}

function viewRolling(st){
  const str = strengths(st);
  const queue = queueOrder();
  const away  = S.players.filter(p => p.away);
  const want  = activeCourts();

  const qPill = id => {
    const s = st[id] || {games:0};
    /* How many matches have gone by since this player was last on. The queue
       is ordered by games played, which hides the person who is simply out of
       phase -- the games column stays level while they keep not getting on.
       Calibrated against 43,200 observations of real queue waits: the median
       wait is 0 matches, p95 is 3 and p99 is 4, but the tail reaches 16. A
       threshold of five therefore marks under 1% of waiting players, which is
       the point -- it should pick out the person being left behind, not
       decorate the eight people having a normal short rest. */
    const pl = P(id);
    const w = (S.matches || []).length - (pl ? (pl.lastPlayed || 0) : 0);
    const stuck = w >= 5;
    return `<button class="pill ${sel===id?'sel':''}" data-pid="${id}"
      style="${sel===id?'border-color:var(--court);background:rgba(14,138,79,.12)'
                       :(stuck?'border-color:var(--warn)':'')}"
      onclick="tapRolling('${id}')"><i class="tdot" data-tier="${tierOf(P(id))}"></i>${esc(nameOf(id))}
      <span style="color:${stuck?'var(--warn)':'var(--ink3)'};font-size:11.5px;font-weight:800">${
        stuck ? 'waiting ' + w : (s.games||0) + ' ' + ((s.games||0)===1?'game':'games')}</span></button>`;
  };

  const chip = id => {
    const s = st[id] || {pts:0, games:0};
    return `<button class="chip ${sel===id?'sel':''}" data-pid="${id}" onclick="tapRolling('${id}')">
      <i class="tdot" data-tier="${tierOf(P(id))}"></i>
      <span>${esc(nameOf(id))}</span><span class="st">${winsOnly()
        ? `${s.wins||0} ${(s.wins||0)===1?'win':'wins'} · ${s.games} ${s.games===1?'game':'games'}`
        : `${s.pts} pts · ${s.games} ${s.games===1?'game':'games'}`}</span></button>`;
  };

  const team = (c, side, i) => {
    const t = c[side];
    if(!c.entering){
      return `<div class="team"><div class="tnames">${t.map(chip).join('')}</div></div>`;
    }
    const w = c.winner===side, l = c.winner && c.winner!==side;
    return `<button class="team ${w?'win':''} ${l?'lose':''}" onclick="pickWinner(${i},'${side}')">
      <div style="font-size:17px;font-weight:800">${esc(teamName(t))}</div>
      <div class="mini" style="margin-top:4px">${w?'WINNER':l?'':'Tap if they win'}</div></button>`;
  };

  /* A court the draw could not fill -- either fewer than four free, or the
     clique guard holding it so the groups mix. It keeps a card with a button
     so the host is never looking at an empty court she cannot act on. */
  const heldCard = i => `<div class="court held">
      <div class="court-h"><span class="cn">Court ${i+1}</span>
        <span class="bal" style="color:var(--acc)">waiting</span></div>
      <div class="court-b">
        <div class="empty" style="padding:20px 10px">
          <b>${queue.length >= 4 ? 'Waiting to mix' : 'Waiting for players'}</b>
          ${queue.length >= 4
            ? 'Everyone free has just played here together. It fills when another court finishes, so the groups mix.'
            : 'A court needs four free players.'}
        </div>
        ${queue.length >= 4
          ? `<button class="btn pri full" style="margin-top:4px" onclick="nextTeams(${i})">Draw now</button>` : ''}
      </div></div>`;

  const courtCard = (c, i) => {
    if(!c){
      const held = queue.length >= 4;
      return `<div class="court"><div class="court-h"><span class="cn">Court ${i+1}</span></div>
        <div class="court-b"><div class="empty" style="padding:22px 10px">
          <b>${held ? 'Waiting to mix' : 'Waiting for players'}</b>
          ${held ? 'Everyone free has just played here together. This court fills when another court finishes, so the groups mix.'
                 : 'A court needs 4 free players.'}
        </div></div></div>`;
    }
    const b = balanceOf(c, str), lbl = b>=85?'🟢 Very balanced':b>=70?'🟡 Fair':'🔴 Uneven';
    const col = b>=85?'var(--acc)':b>=70?'var(--warn)':'var(--bad)';
    const ready = c.winner && (winsOnly() || hasScore(c));
    return `<div class="court">
      <div class="court-h"${courtHeadStyle(c)}>
        <span class="cn">Court ${i+1}</span>${S.settings.pairing==='level'?`<span class="ctier">${courtTiers(c)}</span>`:''}
        <span class="bal" style="color:${col}">${lbl} ${b}%</span>
      </div>
      <div class="court-b">
        ${team(c,'a',i)}
        <div class="vs"><span>VS</span></div>
        ${team(c,'b',i)}
        ${!c.entering
          ? `<div class="row" style="gap:8px;margin-top:11px">
               <button class="btn pri" style="flex:1 1 auto;min-height:54px" onclick="beginResult(${i})">Finish match</button>
               <button class="btn gho" style="flex:0 0 auto;min-height:54px;padding:0 14px" onclick="reshuffleCourt(${i})">↻ Redraw</button>
             </div>`
          : `${winsOnly()?'':scoreUI(c,i)}
             <button class="btn pri full" style="margin-top:12px" onclick="finishMatch(${i})" ${ready?'':'disabled'}>
               ${ready ? 'Next teams'
                       : (winsOnly() ? 'Tap the winner' : 'Pick a winner and score')}</button>
             <button class="btn gho full" style="margin-top:8px" onclick="cancelResult(${i})">← Back</button>`}
      </div>
    </div>`;
  };

  /* Courts that have finished and are waiting on her. */
  const pending = Object.keys(savedPanel).map(Number)
    .filter(n => n < want && !(S.courts||[])[n]).sort((a,b) => a-b);
  const pendBar = (() => {
    if(!pending.length) return '';
    const ns = pending.map(n => n+1);
    const label = ns.length > 1
      ? 'Courts ' + ns.slice(0,-1).join(', ') + ' and ' + ns[ns.length-1]
      : 'Court ' + ns[0];
    return `<div class="pendbar">
      <span><b>${label}</b> ${ns.length>1?'are':'is'} free${
        queue.length >= 4 ? '' : ' \u00b7 needs 4 players'}</span>
      ${queue.length >= 4
        ? `<button class="btn sm" onclick="nextTeams(${pending[0]})">Next teams</button>` : ''}
    </div>`;
  })();

  return `
  ${pendBar}
  <div class="card tight">
    <div class="row"><span class="mini" style="color:var(--court)">Waiting</span>
      <span class="sp"></span><span class="mini">${queue.length} in the queue</span></div>
    ${(() => {
      if(!queue.length) return '<div class="mini" style="margin-top:8px">Everyone is on court.</div>';
      // The FRONT of the queue, not a prediction. This used to be labelled
      // "Next up" and claimed to be the four who go on at the next finish, but
      // chooseFour weighs skill grouping and variety as well as waiting time
      // and need not pick them -- measured at 20 players on 3 courts, it named
      // somebody who did not go on in 83% of changeovers. Who actually comes
      // on is now shown on the result panel, where it is known rather than
      // guessed, so this is free to be an honest queue again.
      const shown = queue.slice(0, 4);
      return `<div class="row wrap" style="margin-top:8px">${shown.map(qPill).join('')}</div>` +
        (queue.length > 4
          ? `<button class="btn xs full" style="margin-top:10px" onclick="queueDialog()">See all ${queue.length} waiting</button>`
          : '');
    })()}
    ${away.length ? `<div class="mini" style="margin-top:10px;color:var(--ink3)">
        ${away.length} away: ${away.map(p=>esc(p.name)).join(', ')} ·
        <button class="btn xs" onclick="go('players')">manage</button></div>` : ''}
  </div>

  ${sel ? `<div class="note">Tap another player to swap <b>${esc(nameOf(sel))}</b> with them.
      <button class="btn xs" style="margin-left:6px" onclick="sel=null;render()">Cancel</button></div>` : ''}

  ${Array.from({length:Math.max(want, (S.courts||[]).length)}, (_,i) => i)
      .filter(i => i < want)
      .map(i => {
        const ps = savedPanel[i];
        if(ps && ps.held) return heldCard(i);
        return courtCard((S.courts||[])[i], i);
      }).join('')}

  ${endBtn()}`;
}

/* Entering a result is a two-step: tap Finish, then pick winner + score.
   Keeps the court card calm while a match is actually being played. */
function beginResult(i){
  const c = S.courts[i]; if(!c) return;
  c.winner = c.winner || null;
  c.entering = true;
  render();
}
function cancelResult(i){
  const c = S.courts[i]; if(!c) return;
  c.entering = false; c.winner = null; c.winScore = null; c.loseScore = null;
  render();
}

function undoLastMatch(){
  const ms=S.matches||[]; if(!ms.length)return;
  ask('The four who played it go back into the queue and the court is redrawn.','Undo the last match',()=>{
    const m=ms.pop();
    [...m.a,...m.b].forEach(id=>{const p=P(id); if(p&&p.qg)p.qg--;});
    fillCourts(); render(); toast('Match removed');
  });
}

function endBtn(){
  return `<button class="btn dan full" style="margin-top:18px" onclick="endGame()">🏁 End game &amp; see final score</button>`;
}
function endGame(){
  ask('Matches already finished are kept. You can resume afterwards if you want to keep playing.',
      'End the game',()=>{S.ended=true;sel=null;tab='game';window.scrollTo(0,0);render();toast('Game over — final score below')});
}
function resumeGame(){S.ended=false;tab='game';render();toast('Back in play')}

function viewFinal(st){
  const list=ranked(st).filter(s=>st[s.id].games>0);
  if(!list.length)return `<div class="card"><div class="empty"><span class="ic">🏸</span><b>No games were played</b>
    Nothing to score yet.</div></div>
    <button class="btn pri full" onclick="resumeGame()">Back to the session</button>`;
  const win=list[0], medals=['🥇','🥈','🥉'];
  const gs=S.players.map(p=>st[p.id].games);
  let margins=[],pc={};
  (S.matches||[]).forEach((c,i)=>{
    if(!c.winner||!hasScore(c))return;
    margins.push({m:c.winScore-lossOf(c),r:i+1,ws:c.winScore,ls:lossOf(c),
      w:c.winner==='a'?c.a:c.b});
    [c.a,c.b].forEach(t=>{const k=pk(t[0],t[1]);pc[k]=(pc[k]||0)+1});
  });
  margins.sort((a,b)=>a.m-b.m);
  const row=(k,v,sub)=>`<div class="stat"><span class="k">${k}</span><span class="v">${v}${sub?`<small>${sub}</small>`:''}</span></div>`;
  return `
  <div class="champ">
    <div class="lbl">🏸 Final score · ${matchesDone()} match${matchesDone()===1?'':'es'}</div>
    <div class="nm">${esc(nameOf(win.id))}</div>
    <div class="pts">${win.pts} points · ${win.games} games · ${win.avg.toFixed(1)} per game</div>
  </div>
  <div class="podium">
    ${list.slice(0,3).map((s,i)=>`<div><div class="m">${medals[i]}</div>
      <div class="n">${esc(nameOf(s.id))}</div><div class="p">${s.pts}</div></div>`).join('')}
  </div>
  <div class="sec-h">Everyone</div>
  <div class="card" style="padding:4px 12px">
  <table><thead><tr><th class="rk">#</th><th>Player</th><th>Pts</th><th>G</th><th>Avg</th><th>W–L</th></tr></thead><tbody>
  ${list.map((s,i)=>`<tr class="${i<3?'top'+(i+1):''}"><td class="rk">${i<3?medals[i]:i+1}</td>
    <td>${esc(nameOf(s.id))}</td><td style="font-weight:900">${s.pts}</td><td>${s.games}</td>
    <td>${s.avg.toFixed(1)}</td><td class="muted" style="font-size:12.5px">${s.wins}–${s.losses}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="sec-h">How it went</div>
  <div class="card">
    ${margins.length?row('Closest game',`${margins[0].ws}–${margins[0].ls}`,
        `Match ${margins[0].r} · ${esc(teamName(margins[0].w))}`):''}
    ${margins.length?row('Biggest win',`${margins[margins.length-1].ws}–${margins[margins.length-1].ls}`,
        `Match ${margins[margins.length-1].r} · ${esc(teamName(margins[margins.length-1].w))}`):''}
    ${row('Games played','',`${Math.min(...gs)}–${Math.max(...gs)} each · gap of ${Math.max(...gs)-Math.min(...gs)}`)}
    ${row('Different partnerships','',`${Object.keys(pc).length} pairs, ${Object.values(pc).filter(v=>v>1).length} repeated`)}
  </div>
  <button class="btn pri full" style="margin-top:4px" onclick="resumeGame()">↩︎ Keep playing</button>
  <button class="btn dan full" style="margin-top:11px" onclick="newSession()">New session</button>`;
}

function scoreUI(c,i){
  if(!c.winner)return '';
  const ft=isFirstTo();
  const [min,max]=scoreRange();
  const picked=pickedValue(c), ws=c.winScore, ls=lossOf(c);
  const opts=[];for(let v=min;v<=max;v++)opts.push(v);
  return `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
    <div class="mini">${ft?`Loser's score \u00b7 first to ${S.settings.total}`
                         :`Winning score \u00b7 total ${S.settings.total}`}</div>
    ${ws!=null?`<div class="score"><span class="w">${ws}</span><span class="l">\u2013</span><span>${ls}</span></div>`
             :ft?`<div class="score"><span class="w">${S.settings.total}</span><span class="l">\u2013</span><span class="l">?</span></div>`:''}
    <div class="scorepick${opts.length>12?' wide':''}">${opts.map(v=>
      `<button class="${picked===v?'on':''}" onclick="setScore(${i},${v})">${v}</button>`).join('')}</div>
    ${S.settings.allowOverride?`<div class="row" style="margin-top:8px">
      <input type="number" inputmode="numeric" placeholder="${ft?"Loser's score":'Winning score'}" id="ovr${i}"
       value="${picked!=null&&!opts.includes(picked)?picked:''}">

/* ---------------- leaderboard ------------------------------------------- */
function rankKey(s){
  if(winsOnly())return[s.wins,s.wr,s.games];
  switch(S.settings.rankBy){
    case 'avg':return[s.avg,s.pts,s.wins];
    case 'wins':return[s.wins,s.pts,s.avg];
    case 'winpct':return[s.wr,s.wins,s.pts];
    default:return[s.pts,s.avg,s.wins];
  }
}
function ranked(st){
  return S.players.map(p=>st[p.id]).sort((a,b)=>{
    const A=rankKey(a),B=rankKey(b);
    for(let i=0;i<A.length;i++)if(B[i]!==A[i])return B[i]-A[i];
    return nameOf(a.id).localeCompare(nameOf(b.id));
  });
}
function viewBoard(st){
  const list=ranked(st);
  if(!matchesDone())return `<div class="card"><div class="empty"><span class="ic">\u{1F3C6}</span><b>No results yet</b>
    Save the first match result and the table fills in</div></div>`;
  const avgG=S.players.reduce((a,p)=>a+st[p.id].games,0)/S.players.length;
  const resting=new Set();
  const label=winsOnly()?'Wins':{points:'Total Points',avg:'Avg / Game',wins:'Wins',winpct:'Win %'}[S.settings.rankBy];
  const P_=!winsOnly();                      // show the points columns?
  const pct=s=>Math.round(s.wr*100)+'%';
  const medal=['\u{1F947}','\u{1F948}','\u{1F949}'];

  const rowFor=(s,i,showMedal)=>`<tr class="${showMedal&&i<3?'top'+(i+1):''} ${resting.has(s.id)?'rest':''}">
    <td class="rk">${showMedal&&i<3?medal[i]:i+1}</td>
    <td>${esc(nameOf(s.id))}</td>
    ${P_?`<td style="font-weight:900">${s.pts}</td>`:''}
    <td class="${s.games<avgG-0.5?'few':''}">${s.games}</td>
    ${P_?`<td>${s.games?s.avg.toFixed(1):'\u2013'}</td>`:''}
    <td style="${P_?'':'font-weight:900'}">${s.wins}</td><td>${s.losses}</td>
    <td>${s.games?pct(s):'\u2013'}</td></tr>`;

  const table=(rows,showMedal)=>`<div class="card board">
    <table><thead><tr><th class="rk">#</th><th>Player</th>${P_?'<th>Pts</th>':''}<th>G</th>${P_?'<th>Avg</th>':''}<th>W</th><th>L</th><th>Win%</th></tr></thead>
    <tbody>${rows.map((s,i)=>rowFor(s,i,showMedal)).join('')}</tbody></table></div>`;

  const header=`<div class="card tight"><div class="row"><span class="mini">Ranked by ${label}</span><span class="sp"></span>
    <span class="mini">avg ${avgG.toFixed(1)} games</span></div></div>`;

  // Social mix: one table, as before -- everyone plays everyone, so one
  // ranking is meaningful.
  if(S.settings.pairing!=='level'){
    return header + table(list,true) +
      `<div class="muted" style="padding:0 4px 4px">${medal.join('')} top three \u00b7
        <span style="color:var(--court)">green</span> = fewer games than the session average</div>` +
      highlights(st);
  }

  // Same level: a single table is misleading, because each group only ever
  // plays itself. Beating your own group 21-18 scores the same whichever
  // group it is, so the overall order says little about who is stronger.
  // Top three stays for bragging rights; the per-group tables are the part
  // the host can actually read something into.
  const groups=TIERS.map(([k,name])=>{
    const ids=new Set(S.players.filter(p=>p.tier===k).map(p=>p.id));
    return {k,name,rows:list.filter(s=>ids.has(s.id))};
  }).filter(g=>g.rows.length);

  return header +
   `<div class="sec-h">Top three \u2014 all groups</div>` +
   table(list.slice(0,3),true) +
   `<div class="muted" style="padding:0 4px 10px">${winsOnly()?'Most wins':'Most points'} tonight, whichever group they play in.</div>` +
   groups.map(g=>`
     <div class="sec-h"><i class="tdot" data-tier="${g.k}" style="margin-right:7px"></i>${g.name}
       <span style="font-weight:700;color:var(--ink3)"> \u00b7 ${g.rows.length}</span></div>
     ${table(g.rows,false)}`).join('') +
   `<div class="muted" style="padding:0 4px 4px">Each group only plays itself, so compare people
     <b>within</b> a group \u2014 someone winning most of theirs may belong a group up.
     <span style="color:var(--court)">green</span> = fewer games than the session average</div>` +
   highlights(st);
}

function highlights(st){
  const played=S.players.map(p=>st[p.id]).filter(s=>s.games>0);
  if(played.length<2)return '';
  const top=f=>played.slice().sort((a,b)=>f(b)-f(a)||b.pts-a.pts)[0];
  const bot=f=>played.slice().sort((a,b)=>f(a)-f(b)||a.pts-b.pts)[0];
  const pct=s=>Math.round(s.wr*100)+'%';
  const wl=s=>s.wins+'\u2013'+s.losses;
  const card=(lab,s,val,low)=>`<div class="${low?'low':''}">
    <div class="lab">${lab}</div><div class="nm">${esc(nameOf(s.id))}</div><div class="val">${val}</div></div>`;
  const hp=top(s=>s.pts), hw=top(s=>s.wr), mw=top(s=>s.wins), mg=top(s=>s.games);
  const lp=bot(s=>s.pts), lw=bot(s=>s.wins), lwp=bot(s=>s.wr);
  return `
  <div class="sec-h">Session highlights</div>
  <div class="hl">
    ${winsOnly()
      ? card('\u{1F3C6} Most wins',mw,mw.wins+(mw.wins===1?' win':' wins'))
      : card('\u{1F3F8} Highest points',hp,hp.pts+' pts')}
    ${card('\u{1F525} Best win rate',hw,pct(hw)+' \u00b7 '+wl(hw))}
    ${winsOnly()
      ? card('\u{1F3D1} Most games',mg,mg.games+(mg.games===1?' game':' games'))
      : card('\u{1F3C6} Most wins',mw,mw.wins+(mw.wins===1?' win':' wins'))}
    ${winsOnly()
      ? card('\u{1F4C9} Fewest wins',lw,lw.wins+(lw.wins===1?' win':' wins'),1)
      : card('\u{1F4C9} Lowest points',lp,lp.pts+' pts',1)}
    ${card('\u{1F944} Fewest wins',lw,lw.wins+(lw.wins===1?' win':' wins'),1)}
    ${card('\u2601\uFE0F Lowest win rate',lwp,pct(lwp)+' \u00b7 '+wl(lwp),1)}
  </div>`;
}
